.tag{display:inline-block;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:900;color:#15121f}

/* ---------- programme ---------- */
const E=(n,s,t)=>({n,t,sets:Array.from({length:s},()=>({kg:"",reps:"",ok:false}))});
const TPL={

 FB:()=>({name:"Full body B",ex:[E("Rowing poulie basse",3,"12-15"),E("Développé couché haltères",3,"12-15"),E("Fente arrière",3,"12"),E("Oiseau (pec deck inversé)",3,"15"),E("Triceps poulie",3,"12-15")]}),
 HA:()=>({name:"Haut A (pousser)",ex:[E("Développé couché haltères",4,"8-12"),E("Rowing unilatéral",3,"10-12"),E("Développé épaules assis",3,"8-12"),E("Curl haltères",2,"12-15")]}),
 BA:()=>({name:"Bas",ex:[E("Squat ou presse",3,"8-12"),E("Soulevé de terre roumain léger",3,"10"),E("Leg curl",3,"12"),E("Mollets",3,"15"),E("Gainage (s)",3,"40")]}),

function makeWeek(w){const d={};DAYS.forEach(x=>d[x]={name:"Repos",ex:[]});const set=(day,k)=>d[day]=TPL[k]();

/* ---------- données (copie unique depuis l'ancienne appli, sans la modifier) ---------- */

D.done=D.done||{};D.state=D.state||{};D.imgs=D.imgs||{};D.warm=D.warm||{};D.stretch=D.stretch||{};D.wlist=D.wlist||{};D.slist=D.slist||{};D.chr=D.chr||{};D.sxp=D.sxp||{};
if(D.imgv!==IMGV){D.imgs={};D.imgv=IMGV}
D.body=D.body||{p:{prenom:"",nom:"",age:"",taille:"",cible:""},w:{}};
D.sessions=D.sessions||{};D.badges=D.badges||{};D.best=D.best||0;D.recs=D.recs||0;
D.settings=Object.assign({goal:3,wake:false,dark:false,rest:90,restEx:120,snd:true,lang:"fr"},D.settings||{});
D.settings.rest=Math.min(360,Math.max(90,+D.settings.rest||90));D.settings.restEx=Math.min(360,Math.max(120,+D.settings.restEx||120));
{const _l=D.settings.lang,_m={en:"MTWTFSS",de:"MDMDFSS",es:"LMXJVSD",it:"LMMGVSD"}[_l];if(_m)DAYS.forEach((d,i)=>{DL[d]=_m[i]})}

const wk=()=>Object.keys(D.weeks).map(Number).sort((a,b)=>a-b);
const todayDay=()=>DAYS[(new Date().getDay()+6)%7];
let mode="log",W=+D.state.week||wk()[0],day=todayDay(),OPEN=null;
if(!D.weeks[W])W=wk()[0];
if(!D.weeks[W][day])day="Mar";

/* ---------- mascotte originale : l'ourson Bobo ---------- */
function mascot(s,mood){const mouth=mood==="happy"?'<path d="M42 68 Q50 80 58 68 Z" fill="#2a1d4e"/><path d="M46 74 Q50 77 54 74 Q50 72 46 74 Z" fill="#f472b6"/>':'<path d="M44 69 Q50 74 56 69" stroke="#2a1d4e" stroke-width="3.5" fill="none" stroke-linecap="round"/>';
 return `<svg width="${s}" height="${s}" viewBox="0 0 100 100" aria-hidden="true"><circle cx="24" cy="30" r="13" fill="#7c4ff0"/><circle cx="24" cy="30" r="7" fill="#c4b5fd"/><circle cx="76" cy="30" r="13" fill="#7c4ff0"/><circle cx="76" cy="30" r="7" fill="#c4b5fd"/><circle cx="50" cy="56" r="35" fill="#8b5cf6"/><path d="M16 45Q50 28 84 45L85 54Q50 37 15 54Z" fill="#fbbf24"/><ellipse cx="50" cy="68" rx="17" ry="13" fill="#ddd6fe"/><circle cx="37" cy="59" r="5" fill="#2a1d4e"/><circle cx="63" cy="59" r="5" fill="#2a1d4e"/><circle cx="38.5" cy="57.5" r="1.6" fill="#fff"/><circle cx="64.5" cy="57.5" r="1.6" fill="#fff"/><ellipse cx="50" cy="64.5" rx="5" ry="3.5" fill="#2a1d4e"/>${mouth}<circle cx="27" cy="67" r="4.5" fill="#f472b6" opacity=".45"/><circle cx="73" cy="67" r="4.5" fill="#f472b6" opacity=".45"/></svg>`}

/* ---------- stats, série, XP, badges ---------- */
function wstart(ds){const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function streak(){const cnt={};Object.values(D.sessions).forEach(ds=>{const w=wstart(ds);cnt[w]=(cnt[w]||0)+1});
 const goal=D.settings.goal,cur=wstart(today());let n=(cnt[cur]||0)>=goal?1:0;const dd=new Date(cur+"T12:00:00");
 for(let i=0;i<520;i++){dd.setDate(dd.getDate()-7);if((cnt[iso(dd)]||0)>=goal)n++;else break}
 return{n,cnt,goal,thisWeek:cnt[cur]||0}}
function xpOf(k){if(D.sxp&&D.sxp[k]!=null)return D.sxp[k];const a=k.split("|"),x=D.weeks[a[0]]&&D.weeks[a[0]][a[1]];if(!x)return 50;let n=0;x.ex.forEach(e=>e.sets.forEach(s=>{if(done(s))n++}));return n*10+50}
function stats(){let sets=0;wk().forEach(w=>DAYS.forEach(d=>D.weeks[w][d].ex.forEach(e=>e.sets.forEach(s=>{if(done(s))sets++}))));
 const sessions=Object.keys(D.sessions).length,xp=Object.keys(D.sessions).reduce((a,k)=>a+xpOf(k),0),st=streak();
 return{sets,sessions,xp,level:Math.floor(xp/300)+1,into:xp%300,streak:st.n,week:st.thisWeek,goal:st.goal,cnt:st.cnt}}
const BADGES=[
 ["first","target","Premier pas","1re séance terminée",c=>c.sessions>=1],["s5","dumbbell","Habitué","5 séances",c=>c.sessions>=5],
 ["s10","medal","Régulier","10 séances",c=>c.sessions>=10],["s25","trophy","Athlète","25 séances",c=>c.sessions>=25],
 ["w2","flame","Sur la lancée","2 semaines d’affilée",c=>c.best>=2],["w4","star","Un mois de feu","4 semaines d’affilée",c=>c.best>=4],
 ["w8","mountain","Inarrêtable","8 semaines d’affilée",c=>c.best>=8],["w12","crown","Légende","12 semaines d’affilée",c=>c.best>=12],
 ["k100","check","100 séries","100 séries validées",c=>c.sets>=100],["k500","diamond","500 séries","500 séries validées",c=>c.sets>=500],
 ["r1","trend","Premier record","Bats un record",c=>c.recs>=1],["lv5","bolt","Niveau 5","Atteins le niveau 5",c=>c.level>=5]];
function checkBadges(){const st=stats();D.best=Math.max(D.best,st.streak);const c=Object.assign({},st,{best:D.best,recs:D.recs}),n=[];
 BADGES.forEach(b=>{if(!D.badges[b[0]]&&b[4](c)){D.badges[b[0]]=today();n.push(b)}});return n}

/* ---------- records ---------- */
function recMap(){const m={};wk().forEach(w=>DAYS.forEach(d=>D.weeks[w][d].ex.forEach(e=>e.sets.forEach(s=>{if(!done(s)||!(+s.reps>0))return;
 const r=m[e.n]||(m[e.n]={kg:0,reps:0,max:0});const kg=+s.kg||0;r.max=Math.max(r.max,+s.reps);
 if(kg>r.kg||(kg===r.kg&&+s.reps>r.reps)){r.kg=kg;r.reps=+s.reps}}))));return m}
function isRecord(ex,set){const kg=+set.kg||0,reps=+set.reps||0;if(!reps)return false;let any=false,mk=0,mr=0,mx=0;
 wk().forEach(w=>DAYS.forEach(d=>D.weeks[w][d].ex.forEach(e=>{if(e.n!==ex.n)return;e.sets.forEach(s=>{if(s===set||!done(s)||!(+s.reps>0))return;any=true;const k=+s.kg||0;mx=Math.max(mx,+s.reps);
  if(k>mk||(k===mk&&+s.reps>mr)){mk=k;mr=+s.reps}})})));
 if(!any)return false;return /gainage/i.test(ex.n)?reps>mx:(kg>mk||(kg===mk&&reps>mr))}
const recText=(n,s)=>/gainage/i.test(n)?s.reps+" s":((+s.kg||0)>0?fmt(s.kg)+" kg × "+s.reps:s.reps+" reps");

/* ---------- toast / célébration / confettis ---------- */
let tt;function toast(m,icn){const t=$("toast");t.innerHTML=(icn?ic(icn,20):"")+"<span>"+esc(m)+"</span>";t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),3800)}
function confetti(){const c=["#8b5cf6","#c4b5fd","#fbbf24","#f472b6","#818cf8","#ff8a3d"];for(let i=0;i<46;i++){const e=document.createElement("div");e.className="cf";
 e.style.left=Math.random()*100+"vw";e.style.background=c[i%c.length];e.style.animationDuration=(1.8+Math.random()*1.8)+"s";e.style.animationDelay=(Math.random()*.5)+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),4500)}}
let CELE=null;

/* ---------- roulette de nombres ---------- */
const TEN=Array.from({length:10},(_,i)=>i/10),QUA=[0,.25,.5,.75];
const decLab=d=>d===0?",0":","+String(d).split(".")[1];
let WV=null;
function wheel(o){const ints=[];for(let i=o.min;i<=o.max;i++)ints.push(i);
 let v=(o.val===""||o.val==null||isNaN(+o.val))?(o.def!=null?+o.def:o.min):+o.val;
 const maxv=o.max+(o.dec?o.dec[o.dec.length-1]:0);v=Math.min(Math.max(v,o.min),maxv);
 let ip=Math.floor(v+1e-9),di=0;if(o.dec){const fr=v-ip;let b=1e9;o.dec.forEach((d,j)=>{if(Math.abs(d-fr)<b){b=Math.abs(d-fr);di=j}})}
 ip=Math.min(Math.max(ip,o.min),o.max);WV={o,ints,ii:ip-o.min,di};
 const col=(id,arr,sel,lab,c)=>`<div class="wcol" id="${id}" onscroll="wsc(${c})">${arr.map((x,j)=>`<div class="${j==sel?'s':''}" onclick="wgo(${c},${j})">${lab(x)}</div>`).join("")}</div>`;
 $("wv").innerHTML=`<div class="wsheet" onclick="event.stopPropagation()"><div class="wt"><h3>${esc(o.title)}</h3><button class="xb" style="position:static" onclick="wclose()" aria-label="Fermer">${ic("x",18)}</button></div>
 <div class="wcols">${col("wc0",ints,WV.ii,x=>x,0)}${o.dec?col("wc1",o.dec,di,decLab,1):""}<span class="wunit">${o.unit||""}</span><div class="wband"></div></div>
 <div class="wbtn">${o.clear?'<button class="btn" onclick="wclear()">Effacer</button>':''}<button class="btn g" onclick="wok()">Valider</button></div></div>`;
 $("wv").classList.add("open");$("wc0").scrollTop=WV.ii*44;if(o.dec)$("wc1").scrollTop=di*44}
function wsc(c){if(!WV)return;const el=$("wc"+c),n=c?WV.o.dec.length:WV.ints.length;let i=Math.round(el.scrollTop/44);i=Math.max(0,Math.min(n-1,i));
 const k=c?"di":"ii";if(WV[k]!==i){const ch=el.children;if(ch&&ch[WV[k]])ch[WV[k]].classList.remove("s");if(ch&&ch[i])ch[i].classList.add("s");WV[k]=i;if(navigator.vibrate)navigator.vibrate(5)}}
function wgo(c,j){const el=$("wc"+c);if(el.scrollTo)el.scrollTo({top:j*44,behavior:"smooth"})}
function wok(){if(!WV)return;const o=WV.o;let v=WV.ints[WV.ii]+(o.dec?o.dec[WV.di]:0);v=Math.round(v*100)/100;wclose();o.onOk(v)}
function wclear(){if(!WV)return;const o=WV.o;wclose();o.onOk("")}
function wclose(){$("wv").classList.remove("open");WV=null}

 const full=p.sets.every(s=>done(s)&&+s.reps>=top),kg=Math.max(0,...p.sets.map(s=>+s.kg||0));

function prev(w,ex){for(const x of wk().filter(k=>k<w).reverse())for(const dd of DAYS)for(const e of D.weeks[x][dd].ex)if(e.n===ex&&e.sets.some(s=>s.kg!==""||s.reps!==""))return e;return null}

 if(f==="kg")wheel({title:ttl,unit:"kg",min:0,max:300,dec:QUA,val:s.kg,def:q&&q.kg!==""?q.kg:10,clear:true,onOk:v=>setv(i,k,"kg",v)});

const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function drawLine(id,pts,zero=true){const c=$(id);if(!c)return;const x=c.getContext("2d"),w=c.width,h=c.height;x.clearRect(0,0,w,h);
 const fs=Math.max(11,Math.round(h/18)),pl=Math.round(w*.05),pr=Math.round(w*.04),pt=Math.round(h*.12),pb=Math.round(h*.14);x.font="800 "+fs+"px sans-serif";
 if(!pts.length){x.fillStyle=cssv("--mut");x.fillText("Pas encore de données",pl,pt+fs);return}
 let lo=Math.min(...pts.map(p=>p[1])),hi=Math.max(...pts.map(p=>p[1]));
 if(zero){lo=0;hi=hi*1.15||1}else{const pad=Math.max((hi-lo)*.25,.5);lo-=pad;hi+=pad}
 const X=i=>pl+(pts.length>1?i*((w-pl-pr)/(pts.length-1)):(w-pl-pr)/2),Y=v=>h-pb-(v-lo)/((hi-lo)||1)*(h-pt-pb);
 x.strokeStyle=cssv("--bd");x.lineWidth=2;for(let k=0;k<4;k++){const y=pt+k*(h-pt-pb)/3;x.beginPath();x.moveTo(pl-6,y);x.lineTo(w-pr+6,y);x.stroke()}
 x.strokeStyle="#8b5cf6";x.lineWidth=Math.max(4,h/60);x.lineJoin="round";x.lineCap="round";x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(i),Y(p[1])):x.moveTo(X(i),Y(p[1])));x.stroke();
 pts.forEach((p,i)=>{x.fillStyle="#8b5cf6";x.beginPath();x.arc(X(i),Y(p[1]),Math.max(5,h/45),0,7);x.fill();x.fillStyle=cssv("--tx");x.fillText(p[1],X(i)-fs*.7,Y(p[1])-fs*.9);x.fillStyle=cssv("--mut");x.fillText(p[0],X(i)-fs*.7,h-pb*.3)})}
function series(name,m){const pts=[];wk().forEach(w=>{let v=0,any=false;DAYS.forEach(d=>D.weeks[w][d].ex.filter(x=>x.n==name).forEach(x=>x.sets.forEach(s=>{
  if(done(s)&&s.reps!==""){any=true;const kg=s.kg===""?0:s.kg;if(m=="max")v=Math.max(v,kg);else v+=s.reps}})));if(any)pts.push(["S"+w,Math.round(v*10)/10])});return pts}
function pickEx(n){PEX=n;prog()}
function prog(){const s=new Set();wk().forEach(w=>DAYS.forEach(d=>D.weeks[w][d].ex.forEach(e=>s.add(e.n))));
 const names=[...s].filter(n=>series(n,"rep").length).sort((a,b)=>a.localeCompare(b,"fr",{sensitivity:"base"}));let h=`<div class="title">Mes <span>progrès</span></div>`+seg(PMN,PM,"subProg");
