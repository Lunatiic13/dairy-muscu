<style>

.prow{display:flex;align-items:center;gap:10px;margin:8px 0 14px}.prow .hint{white-space:nowrap}

.lbl{text-align:center;color:var(--mut);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.6px}
.ckb{width:46px;height:46px;border-radius:50%;border:2px solid var(--bd);border-bottom-width:4px;background:var(--bg);color:transparent;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.ckb.on{background:var(--g);border-color:var(--gd);color:#fff}
.chk{border-left:6px solid var(--o)}.chk.st2{border-left-color:var(--b)}
.chk.open{border-color:var(--v2)}.chk .exh .st{background:transparent}.chk .exh .st .ic{color:var(--o)}.chk.st2 .exh .st .ic{color:var(--b)}
.wr{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px solid var(--bd);cursor:pointer}
.wr:first-child{border-top:0}.wr .wtx{flex:1;font-weight:800;font-size:14px}.wr .wtx small{display:block;color:var(--mut);font-size:12px;margin-top:2px}

.finc{display:flex;justify-content:space-between;align-items:center;gap:10px;border-color:var(--g);color:var(--v2);font-weight:900}

.dots{display:flex;justify-content:center;gap:8px;margin:12px 0}.dots i{width:26px;height:26px;border-radius:50%;background:var(--bd);display:block}.dots i.on{background:var(--o);box-shadow:0 0 12px rgba(255,138,61,.6)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.bd{text-align:center;border:2px solid var(--bd);border-radius:18px;padding:12px 6px;background:var(--bg)}

.h3i{display:flex;align-items:center;gap:8px;margin-bottom:8px}.h3i .ic{color:var(--y)}
.rec{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:2px solid var(--bd)}.rec:first-of-type{border-top:0}
.rec b{color:var(--y);white-space:nowrap}
.menu{padding:6px 14px}
.mrow{width:100%;display:flex;align-items:center;gap:14px;padding:14px 0;border:0;border-top:2px solid var(--bd);background:none;color:#fff;font:inherit;font-weight:900;font-size:16px;text-align:left;cursor:pointer}
.mrow:first-child{border-top:0}.mrow .mi{width:42px;height:42px;border-radius:14px;background:rgba(139,92,246,.16);color:var(--v2);display:flex;align-items:center;justify-content:center;flex:none}
.mrow span.t{flex:1}.mrow small{display:block;color:var(--mut);font-size:12px;font-weight:700;margin-top:2px}.mrow .ch{color:var(--mut)}
.prof{display:flex;gap:14px;align-items:center}.prof .pn{font-size:21px;font-weight:900}
.rest{text-align:center;color:var(--mut)}.rest .ic{color:var(--v2);margin-bottom:6px}
canvas{width:100%;height:auto;background:var(--bg);border-radius:16px;border:2px solid var(--bd);display:block}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.pk div{background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding:10px;text-align:center;font-size:12px;color:var(--mut)}.pk b{display:block;color:#fff;font-size:20px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.kpi div{background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding:10px;text-align:center}.kpi small{display:block;color:var(--mut);font-size:11px;margin-bottom:4px}.kpi b{font-size:19px}
.tag{display:inline-block;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:900;color:#15121f}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--mut);font-size:11px;padding:4px}td{padding:6px 4px;border-top:2px solid var(--bd);text-align:center}td .num{width:100px}
.up{color:var(--o)}.dn{color:var(--v2)}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.big2 img,.pg img{width:100%;border-radius:14px;background:#262b35;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in}
.imgcap{text-align:center;margin:6px 0;color:var(--mut);font-size:12px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.pg img{aspect-ratio:3/4}
.pgi{background:var(--bg);border:2px solid var(--bd);border-radius:16px;padding:8px}.pgi.sel{border-color:var(--g)}.pgi p{margin:6px 0;text-align:center;font-size:13px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmp img{width:100%;border-radius:14px;aspect-ratio:3/4;object-fit:cover}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-30px);opacity:0;z-index:130;background:var(--card);border:2px solid var(--y);border-radius:16px;padding:12px 16px;max-width:90vw;font-weight:900;pointer-events:none;transition:all .3s;text-align:center;display:flex;gap:8px;align-items:center}

.ov{display:none;position:fixed;inset:0;z-index:70;background:rgba(15,12,26,.96);align-items:center;justify-content:center;padding:20px;overflow-y:auto}.ov.open{display:flex}

.info p{margin:8px 0;font-size:14px}.info b{color:var(--v2)}.info .e b{color:var(--r)}

.wt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}.wt h3{font-size:17px}

.wbtn{display:flex;gap:10px}.wbtn .btn{flex:1}

/* ---------- jeu d'icônes dessiné pour l'appli ---------- */
const IC={

function wstart(ds){const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function streak(){const cnt={};Object.values(D.sessions).forEach(ds=>{const w=wstart(ds);cnt[w]=(cnt[w]||0)+1});
 const goal=D.settings.goal,cur=wstart(today());let n=(cnt[cur]||0)>=goal?1:0;const dd=new Date(cur+"T12:00:00");
 for(let i=0;i<520;i++){dd.setDate(dd.getDate()-7);if((cnt[iso(dd)]||0)>=goal)n++;else break}
 return{n,cnt,goal,thisWeek:cnt[cur]||0}}

 const sessions=Object.keys(D.sessions).length,xp=sets*10+sessions*50,st=streak();
 return{sets,sessions,xp,level:Math.floor(xp/300)+1,into:xp%300,streak:st.n,week:st.thisWeek,goal:st.goal,cnt:st.cnt}}

function recMap(){const m={};wk().forEach(w=>DAYS.forEach(d=>D.weeks[w][d].ex.forEach(e=>e.sets.forEach(s=>{if(!done(s)||!(+s.reps>0))return;
 const r=m[e.n]||(m[e.n]={kg:0,reps:0,max:0});const kg=+s.kg||0;r.max=Math.max(r.max,+s.reps);
 if(kg>r.kg||(kg===r.kg&&+s.reps>r.reps)){r.kg=kg;r.reps=+s.reps}}))));return m}
function isRecord(ex,set){const kg=+set.kg||0,reps=+set.reps||0;if(!reps)return false;let any=false,mk=0,mr=0,mx=0;
 wk().forEach(w=>DAYS.forEach(d=>D.weeks[w][d].ex.forEach(e=>{if(e.n!==ex.n)return;e.sets.forEach(s=>{if(s===set||!done(s)||!(+s.reps>0))return;any=true;const k=+s.kg||0;mx=Math.max(mx,+s.reps);
  if(k>mk||(k===mk&&+s.reps>mr)){mk=k;mr=+s.reps}})})));
 if(!any)return false;return /gainage/i.test(ex.n)?reps>mx:(kg>mk||(kg===mk&&reps>mr))}

function wheel(o){const ints=[];for(let i=o.min;i<=o.max;i++)ints.push(i);
 let v=(o.val===""||o.val==null||isNaN(+o.val))?(o.def!=null?+o.def:o.min):+o.val;
 const maxv=o.max+(o.dec?o.dec[o.dec.length-1]:0);v=Math.min(Math.max(v,o.min),maxv);
 let ip=Math.floor(v+1e-9),di=0;if(o.dec){const fr=v-ip;let b=1e9;o.dec.forEach((d,j)=>{if(Math.abs(d-fr)<b){b=Math.abs(d-fr);di=j}})}
 ip=Math.min(Math.max(ip,o.min),o.max);WV={o,ints,ii:ip-o.min,di};
 const col=(id,arr,sel,lab,c)=>`<div class="wcol" id="${id}" onscroll="wsc(${c})">${arr.map((x,j)=>`<div class="${j==sel?'s':''}" onclick="wgo(${c},${j})">${lab(x)}</div>`).join("")}</div>`;

 <div class="wcols">${col("wc0",ints,WV.ii,x=>x,0)}${o.dec?col("wc1",o.dec,di,decLab,1):""}<span class="wunit">${o.unit||""}</span><div class="wband"></div></div>
 <div class="wbtn">${o.clear?'<button class="btn" onclick="wclear()">Effacer</button>':''}<button class="btn g" onclick="wok()">Valider</button></div></div>`;
 $("wv").classList.add("open");$("wc0").scrollTop=WV.ii*44;if(o.dec)$("wc1").scrollTop=di*44}
function wsc(c){if(!WV)return;const el=$("wc"+c),n=c?WV.o.dec.length:WV.ints.length;let i=Math.round(el.scrollTop/44);i=Math.max(0,Math.min(n-1,i));
 const k=c?"di":"ii";if(WV[k]!==i){const ch=el.children;if(ch&&ch[WV[k]])ch[WV[k]].classList.remove("s");if(ch&&ch[i])ch[i].classList.add("s");WV[k]=i;if(navigator.vibrate)navigator.vibrate(5)}}
function wgo(c,j){const el=$("wc"+c);if(el.scrollTo)el.scrollTo({top:j*44,behavior:"smooth"})}
function wok(){if(!WV)return;const o=WV.o;let v=WV.ints[WV.ii]+(o.dec?o.dec[WV.di]:0);v=Math.round(v*100)/100;wclose();o.onOk(v)}
function wclear(){if(!WV)return;const o=WV.o;wclose();o.onOk("")}

function info(n,t){const k=norm(n),f=INFO.find(x=>x[0].test(k))||[null,...DEF[t||"ex"]];return{m:f[1],c:f[2],e:f[3]}}
const infoHtml=(n,t)=>{const i=info(n,t);return `<div class="info"><p><b>Muscles :</b> ${i.m}</p><p><b>Consigne :</b> ${i.c}</p><p class="e"><b>Erreur à éviter :</b> ${i.e}</p></div>`};

/* ---------- séances ---------- */
function tg(i){OPEN=(OPEN===i?null:i);keep()}
function checklist(cls,id,icn,title,sub,steps,ck,fn,foot,qt){const n=steps.filter((_,k)=>ck[k]).length,op=OPEN===id;
 return `<div class="card ex chk ${cls} ${op?'open':''}"><div class="exh" role="button" tabindex="0" onclick="tg(${id})"><span class="st">${ic(icn,24)}</span><span class="nm">${title}<small>${sub}</small></span><span class="cnt">${n}/${steps.length}</span></div>`+
 (op?`<div class="exb">${steps.map((s,k)=>{const nm=s[0].replace(/^A\/M · /,""),q=qt&&(qt==="str"||/^A\/M · /.test(s[0]));
  return `<label class="wr ${ck[k]?'ck':''}"><input type="checkbox" ${ck[k]?'checked':''} onchange="${fn}(${k},this.checked)"><span class="wtx">${s[0]}<small>${s[1]}</small></span>${q?`<span class="qm" role="button" aria-label="Voir l’exercice" data-n="${esc(nm)}" onclick="event.preventDefault();event.stopPropagation();qs(this,'${qt}')">?</span>`:""}</label>`}).join("")}<p class="hint">${foot}</p></div>`:"")+`</div>`}
function topOf(t){const a=String(t).split("-").map(Number).filter(x=>x>0);return a.length?Math.max(...a):0}
function lowOf(t){const a=String(t).split("-").map(Number).filter(x=>x>0);return a.length?Math.min(...a):10}
function suggest(e,p){if(!p||!p.sets.length)return"";const top=topOf(e.t),sec=/gainage/i.test(e.n);
 const full=p.sets.every(s=>done(s)&&+s.reps>=top),kg=Math.max(0,...p.sets.map(s=>+s.kg||0));
 if(full){if(sec)return `<div class="tip g">${ic("bulb",20)}<div>Objectif atteint la dernière fois (${top} s). Essaie ${top+5} s si ta posture reste parfaite.</div></div>`;
  if(kg>0){const nx=kg+(kg<20?1:2.5);return `<div class="tip g">${ic("bulb",20)}<div>Objectif atteint sur toutes les séries à ${fmt(kg)} kg. Essaie <b>${fmt(nx)} kg</b> si la technique reste propre. Aucune charge n’est modifiée automatiquement.</div></div>`}
  return `<div class="tip g">${ic("bulb",20)}<div>Objectif atteint. Ajoute des reps, ralentis le mouvement ou choisis une variante plus difficile.</div></div>`}
 if(p.sets.some(done))return `<div class="tip o">${ic("bulb",20)}<div>Vise ${top}${sec?" s":" reps"} sur toutes les séries avant d’augmenter la charge.</div></div>`;return""}
function msgBubble(st){const r=st.goal-st.week;
 if(st.week>=st.goal)return"Objectif de la semaine atteint ! Ta série est en sécurité.";
 if(st.streak>0)return `Série de ${plural(st.streak,"semaine","semaines")} ! Plus que ${plural(r,"séance","séances")} cette semaine.`;
 return `Valide ${plural(st.goal,"séance","séances")} cette semaine pour lancer ta série !`}
function log(){const st=stats(),S=cd();let tot=0,dn=0;S.ex.forEach(e=>e.sets.forEach(s=>{tot++;if(done(s))dn++}));
 let h=`<div class="bubble">${mascot(64)}<div class="say">${msgBubble(st)}</div></div>
 <div class="wkbar"><select onchange="W=+this.value;OPEN=null;render()">${wk().map(w=>`<option value="${w}" ${w==W?'selected':''}>Semaine ${w}</option>`).join("")}</select><button class="btn sm" onclick="addWeek()" aria-label="Nouvelle semaine">${ic("plus",20)}</button></div>
 <div class="days">${DAYS.map(d=>{const x=D.weeks[W][d],pl=x.ex.length>0,fi=D.sessions[dayKey(W,d)],pa=pl&&x.ex.some(e=>e.sets.some(done));
  return `<button class="dc ${d==day?'sel':''} ${fi?'fin':pa?'part':pl?'plan':'rest'}" onclick="day='${d}';OPEN=null;render()"><i>${fi?ic("check",20,"thick"):DL[d]}</i>${d}</button>`}).join("")}</div>
 <h2 class="sname">${S.name}</h2>`;
 if(!S.ex.length){$("m").innerHTML=h+`<div class="card rest">${ic("moon",40)}<br>Jour de repos. Récupérer fait partie du programme !</div>`;return}
 h+=`<div class="prow"><div class="pbar" style="flex:1"><b style="width:${tot?Math.round(dn/tot*100):0}%"></b></div><span class="hint">${dn}/${tot} séries</span></div>`;
 h+=checklist("",-1,"thermo","Échauffement","Semaine "+W+" · environ 10 min",warmup(),D.warm[wkey()]||[],"wchk","Méthode RAMP : monter la température, activer/mobiliser, puis potentialiser.","warm");
 S.ex.forEach((e,i)=>{const p=prev(W,e.n),f=e.sets.filter(done).length,all=e.sets.length&&f===e.sets.length,op=OPEN===i,sec=/gainage/i.test(e.n);
  h+=`<div class="card ex ${op?'open':''} ${all?'fin':''}"><div class="exh" role="button" tabindex="0" onclick="tg(${i})"><span class="st">${all?ic("check",22,"thick"):i+1}</span><span class="nm">${e.n}<span class="qm" role="button" aria-label="Voir l’exercice" onclick="event.stopPropagation();sheet(${i})">?</span><small>Objectif : ${e.t} ${sec?'secondes':'reps'}</small></span><span class="cnt">${f}/${e.sets.length}</span></div>`;
  if(op){h+=`<div class="exb">${suggest(e,p)}<div class="set"><span></span><span class="lbl">kg</span><span class="lbl">${sec?'sec':'reps'}</span><span class="lbl">ok</span></div>`;
   e.sets.forEach((s,k)=>{const q=p&&p.sets[k];
    const kv=s.kg!==""?fmt(s.kg):(q&&q.kg!==""?fmt(q.kg):"–"),rv=s.reps!==""?s.reps:(q&&q.reps!==""?q.reps:"–");
    h+=`<div class="set"><span class="n">${k+1}</span><button class="num ${s.kg===''?'ph':''}" onclick="pickNum(${i},${k},'kg')">${kv}</button><button class="num ${s.reps===''?'ph':''}" onclick="pickNum(${i},${k},'reps')">${rv}</button><button class="ckb ${s.ok?'on':''}" onclick="setv(${i},${k},'ok',${!s.ok})" aria-label="Valider la série">${ic("check",26,"thick")}</button></div>`});
   h+=(p?`<div class="hint">Chiffres gris = séance précédente</div>`:"")+`</div>`}
  h+=`</div>`});
 h+=checklist("st2",-2,"lotus","Étirements","Fin de séance · environ 8 min",stretches(),D.stretch[wkey()]||[],"schk","Étirements doux : tiens chaque position sans douleur, en respirant calmement.","str");
 const fi=D.sessions[dayKey(W,day)];
 h+=fi?`<div class="card finc"><span>${ic("check",22,"thick")} Séance terminée le ${frd(fi)}</span><button class="btn sm r" onclick="undoFinish()">Annuler</button></div>`:`<button class="btn g big" onclick="finish()" ${dn?'':'disabled'}>Terminer la séance</button>`;
 $("m").innerHTML=h}
function prev(w,ex){for(const x of wk().filter(k=>k<w).reverse())for(const dd of DAYS)for(const e of D.weeks[x][dd].ex)if(e.n===ex&&e.sets.some(s=>s.kg!==""||s.reps!==""))return e;return null}
function pickNum(i,k,f){const ex=cd().ex[i],s=ex.sets[k],p=prev(W,ex.n),q=p&&p.sets[k],sec=/gainage/i.test(ex.n),ttl=ex.n+" · série "+(k+1);
 if(f==="kg")wheel({title:ttl,unit:"kg",min:0,max:300,dec:QUA,val:s.kg,def:q&&q.kg!==""?q.kg:10,clear:true,onOk:v=>setv(i,k,"kg",v)});
 else wheel({title:ttl,unit:sec?"sec":"reps",min:0,max:sec?600:200,dec:null,val:s.reps,def:q&&q.reps!==""?q.reps:lowOf(ex.t),clear:true,onOk:v=>setv(i,k,"reps",v)})}
function setv(i,k,f,v){const ex=cd().ex[i],s=ex.sets[k],was=s.ok;s[f]=(f=="ok")?v:(v===""?"":+v);
 if(f=="ok"&&v&&!was){if(navigator.vibrate)navigator.vibrate(25);if(isRecord(ex,s)){D.recs++;toast("Nouveau record ! "+ex.n+" : "+recText(ex.n,s),"trophy")}}
 checkBadges().forEach(b=>toast("Badge débloqué : "+b[2],b[1]));keep()}
function finish(){const key=dayKey(W,day);if(D.sessions[key])return;const before=stats();let n=0;cd().ex.forEach(e=>e.sets.forEach(s=>{if(done(s))n++}));
 D.sessions[key]=today();const after=stats(),nb=checkBadges();
 const lines=[["bolt",`+${n*10+50} XP (${plural(n,"série","séries")} + bonus séance)`]];
 lines.push(after.streak>before.streak?["flame",`Série : ${plural(after.streak,"semaine","semaines")} !`]:["flame",`${after.week}/${after.goal} séances cette semaine`]);
 if(after.level>before.level)lines.push(["star",`Niveau ${after.level} atteint !`]);
 nb.forEach(b=>lines.push([b[1],`Badge : ${b[2]}`]));
 const weekDone=DAYS.filter(d=>D.weeks[W][d].ex.length).every(d=>D.sessions[dayKey(W,d)]),ws=wk(),nx=ws.find(x=>x>W);
 const o={title:"Séance terminée !",lines};
 if(weekDone){lines.unshift(["check",`Semaine ${W} complétée`]);if(nx){o.btn="Semaine suivante";o.btn2=true;o.onok=()=>{W=nx;day=DAYS.find(d=>D.weeks[W][d].ex.length)||"Mar";OPEN=null;render()}}}
 save();keep();celebrate(o)}
function undoFinish(){if(confirm("Annuler la validation de cette séance ?")){delete D.sessions[dayKey(W,day)];keep()}}
function addWeek(){const n=Math.max(...wk())+1;D.weeks[n]=JSON.parse(JSON.stringify(D.weeks[n-1]));
 Object.values(D.weeks[n]).forEach(s=>s.ex.forEach(e=>e.sets.forEach(x=>{x.reps="";x.ok=false})));W=n;OPEN=null;render()}

function streakPage(){checkBadges();const st=stats(),m=recMap(),names=Object.keys(m).sort((a,b)=>a.localeCompare(b,"fr",{sensitivity:"base"}));
 const dots=Array.from({length:st.goal},(_,i)=>`<i class="${i<st.week?'on':''}"></i>`).join("");
 const start=new Date(wstart(today())+"T12:00:00");start.setDate(start.getDate()-28);const dset=new Set(Object.values(D.sessions));let cal="";
 for(let i=0;i<35;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);cal+=`<span class="${dset.has(k)?'yes':''} ${k==today()?'td':''}">${d.getDate()}</span>`}
 $("m").innerHTML=`<div class="title">Mes <span>succès</span></div>

 <div class="card"><h3>Niveau ${st.level}</h3><div class="prow"><div class="pbar y" style="flex:1"><b style="width:${Math.round(st.into/3)}%"></b></div><span class="hint">${st.into}/300 XP</span></div>

 <div class="card"><h3 style="margin-bottom:10px">Badges (${Object.keys(D.badges).length}/${BADGES.length})</h3><div class="badges">${BADGES.map(b=>`<div class="bd ${D.badges[b[0]]?'on':'off'}"><div class="bdi">${ic(b[1],28)}</div><b>${b[2]}</b><small>${b[3]}</small></div>`).join("")}</div></div>
 <div class="card"><h3 class="h3i">${ic("trophy",22)} Records personnels</h3>`+(names.length?names.map(n=>{const r=m[n],sec=/gainage/i.test(n);
  return `<div class="rec"><span>${n}</span><b>${sec?r.max+' s':r.kg>0?fmt(r.kg)+' kg × '+r.reps:r.max+' reps'}</b></div>`}).join(""):`<div class="hint">Valide des séries pour établir tes premiers records. Un message apparaît quand tu bats l’un d’eux.</div>`)+`</div>`}

/* ---------- graphiques / progrès ---------- */
function drawLine(id,pts,zero=true){const c=$(id);if(!c)return;const x=c.getContext("2d"),w=c.width,h=c.height;x.clearRect(0,0,w,h);
 const fs=Math.max(11,Math.round(h/18)),pl=Math.round(w*.05),pr=Math.round(w*.04),pt=Math.round(h*.12),pb=Math.round(h*.14);x.font="800 "+fs+"px sans-serif";
 if(!pts.length){x.fillStyle="#a59fc0";x.fillText("Pas encore de données",pl,pt+fs);return}
 let lo=Math.min(...pts.map(p=>p[1])),hi=Math.max(...pts.map(p=>p[1]));
 if(zero){lo=0;hi=hi*1.15||1}else{const pad=Math.max((hi-lo)*.25,.5);lo-=pad;hi+=pad}
 const X=i=>pl+(pts.length>1?i*((w-pl-pr)/(pts.length-1)):(w-pl-pr)/2),Y=v=>h-pb-(v-lo)/((hi-lo)||1)*(h-pt-pb);
 x.strokeStyle="#3b3556";x.lineWidth=2;for(let k=0;k<4;k++){const y=pt+k*(h-pt-pb)/3;x.beginPath();x.moveTo(pl-6,y);x.lineTo(w-pr+6,y);x.stroke()}
 x.strokeStyle="#8b5cf6";x.lineWidth=Math.max(4,h/60);x.lineJoin="round";x.lineCap="round";x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(i),Y(p[1])):x.moveTo(X(i),Y(p[1])));x.stroke();
 pts.forEach((p,i)=>{x.fillStyle="#8b5cf6";x.beginPath();x.arc(X(i),Y(p[1]),Math.max(5,h/45),0,7);x.fill();x.fillStyle="#fff";x.fillText(p[1],X(i)-fs*.7,Y(p[1])-fs*.9);x.fillStyle="#a59fc0";x.fillText(p[0],X(i)-fs*.7,h-pb*.3)})}
function series(name,m){const pts=[];wk().forEach(w=>{let v=0,any=false;DAYS.forEach(d=>D.weeks[w][d].ex.filter(x=>x.n==name).forEach(x=>x.sets.forEach(s=>{
  if(done(s)&&s.reps!==""){any=true;const kg=s.kg===""?0:s.kg;if(m=="max")v=Math.max(v,kg);else v+=s.reps}})));if(any)pts.push(["S"+w,Math.round(v*10)/10])});return pts}
function pickEx(n){PEX=n;prog()}
function prog(){const s=new Set();wk().forEach(w=>DAYS.forEach(d=>D.weeks[w][d].ex.forEach(e=>s.add(e.n))));
 const names=[...s].filter(n=>series(n,"rep").length).sort((a,b)=>a.localeCompare(b,"fr",{sensitivity:"base"}));let h=`<div class="title">Mes <span>progrès</span></div>`+seg(PMN,PM,"subProg");
 if(!names.length){$("m").innerHTML=h+'<div class="card hint">Aucune donnée pour le moment. Dès que tu notes des répétitions, la courbe apparaît ici.</div>';return}
 if(!names.includes(PEX))PEX=names[0];const p=series(PEX,PM),last=p[p.length-1][1],pr=p.length>1?p[p.length-2][1]:null,rec=Math.max(...p.map(q=>q[1]));
 h+=`<div class="wkbar"><select onchange="pickEx(this.value)">${names.map(n=>`<option ${n==PEX?'selected':''}>${n}</option>`).join("")}</select></div>
 <div class="card"><canvas id="pc" width="760" height="300"></canvas><div class="pk"><div>Dernier<b>${fmt(last)}</b></div><div>Record<b>${fmt(rec)}</b></div><div>Vs préc.<b>${pr!=null?delta(last-pr):'–'}</b></div></div></div>`;
 $("m").innerHTML=h;drawLine("pc",p,true)}

 h+=list.map(([n,d],ix)=>{const op=LOPEN===n;return `<div class="card ex ${op?'open':''}"><div class="exh" role="button" tabindex="0" data-i="${ix}" onclick="libTg(this.dataset.i)"><span class="st">${ix+1}</span><span class="nm">${n}${d?`<small>${d}</small>`:""}</span><span class="cnt">${ic(op?"chevU":"chevD",20)}</span></div>${op?`<div class="exb"><div id="lsel"></div>${infoHtml(n,LT)}</div>`:""}</div>`}).join("");
 h+=`<p class="hint">Images : free-exercise-db (domaine public). Quand aucun mouvement identique n’existe dans la base, aucune image n’est affichée.</p>`;$("m").innerHTML=h;if(LOPEN)libShow()}
function libTg(ix){const n=libData()[LT][+ix][0];LOPEN=(LOPEN===n?null:n);const y=window.scrollY;lib();window.scrollTo(0,y)}
function imgBox(n){const r=D.imgs[n];if(!r)return`<div class="hint">Recherche de l’image…</div>`;if(r.none)return`<div class="hint">Pas d’image disponible pour ce mouvement.</div>`;
 ZL=[IMG+r.id+"/0.jpg",IMG+r.id+"/1.jpg"];const cap=esc(n).replace(/'/g,"’");
 return `<div class="big2"><img alt="" src="${ZL[0]}" onclick="zoom(0,'${cap}')"><img alt="" src="${ZL[1]}" onclick="zoom(1,'${cap}')"></div><div class="imgcap">Image : ${esc(r.name)} · touche pour agrandir</div>`}
async function libShow(){const n=LOPEN,el=$("lsel");if(!el||!n)return;el.innerHTML=imgBox(n);if(!D.imgs[n]){try{await ensureImg(n);if(LOPEN===n&&$("lsel"))$("lsel").innerHTML=imgBox(n)}catch(e){if($("lsel"))$("lsel").innerHTML='<div class="hint">Images indisponibles (connexion requise)</div>'}}}
/* fiche d'un exercice, ouverte par le "?" */
let SHN=null;
function sheet(i){sheetN(cd().ex[i].n,"ex")}
function qs(el,t){sheetN(el.dataset.n,t)}
async function sheetN(n,t){SHN=n;$("md").innerHTML=`<div class="sheet" onclick="event.stopPropagation()"><button class="xb" onclick="closeSheet()" aria-label="Fermer">${ic("x",18)}</button><h2>${esc(n)}</h2><div id="shimg">${imgBox(n)}</div>${infoHtml(n,t)}</div>`;$("md").classList.add("open");
 if(!D.imgs[n]){try{await ensureImg(n);if(SHN===n&&$("shimg"))$("shimg").innerHTML=imgBox(n)}catch(e){if($("shimg"))$("shimg").innerHTML='<div class="hint">Images indisponibles (connexion requise)</div>'}}}
function closeSheet(){$("md").classList.remove("open");SHN=null}
let LBK=0,LBC="";
function lbSet(){if(!ZL.length)return;$("lbi").src=ZL[LBK];$("lbc").textContent=LBC+(ZL.length>1?" · "+(LBK+1)+"/"+ZL.length:"")}
function zoom(k,cap){if(!ZL.length)return;LBK=k;LBC=cap||"";lbSet();$("lb").classList.add("open")}
function lbNext(d){if(!ZL.length)return;LBK=(LBK+(d||1)+ZL.length)%ZL.length;lbSet()}
function lbClose(){$("lb").classList.remove("open")}
document.addEventListener("keydown",e=>{if(e.key=="Escape"){lbClose();closeSheet();wclose()}if(e.key=="ArrowRight")lbNext(1);if(e.key=="ArrowLeft")lbNext(-1)});

/* ---------- profil (menu) ---------- */
function profilPage(){const st=stats(),p=D.body.p,nm=(p.prenom+" "+p.nom).trim()||"Mon profil";
 const rows=[["phys","scale","Physique","Poids, IMC, évolution"],["photos","camera","Photos","Photos de progression"],["rem","clock","Rappels","Jours et heure d’entraînement"],["set","gear","Réglages","Objectif, écran allumé"]];
 $("m").innerHTML=`<div class="card prof">${mascot(72)}<div style="flex:1"><div class="pn">${esc(nm)}</div><div class="hint">Niveau ${st.level} · ${st.xp} XP</div><div class="pbar y" style="margin-top:8px"><b style="width:${Math.round(st.into/3)}%"></b></div></div></div>
 <div class="card menu">${rows.map(r=>`<button class="mrow" onclick="go('${r[0]}')"><span class="mi">${ic(r[1],24)}</span><span class="t">${r[2]}<small>${r[3]}</small></span><span class="ch">${ic("chevR",22)}</span></button>`).join("")}</div>`}

/* ---------- physique ---------- */
const P=()=>D.body.p,BW=()=>D.body.w,bmi=(kg,cm)=>(kg&&cm)?kg/((cm/100)**2):null;
const f1=v=>v==null?"–":(Math.round(v*10)/10).toString().replace(".",",");
function cat(b){if(b==null)return["–","#a59fc0"];if(b<18.5)return["Insuffisance pondérale","#818cf8"];if(b<25)return["Corpulence normale","#a78bfa"];if(b<30)return["Surpoids","#fbbf24"];return["Obésité","#fb5a6d"]}
function delta(d){if(d==null||isNaN(d))return"–";const r=Math.round(d*10)/10;if(r==0)return"=";return r>0?`<span class="up">▲ +${f1(r)}</span>`:`<span class="dn">▼ -${f1(-r)}</span>`}
function setP(k,v){P()[k]=v;save();hdr();phys()}
function setW(w,v){if(v==="")delete BW()[w];else BW()[w]=+v;save();phys()}
const PCFG={age:{title:"Âge",unit:"ans",min:10,max:99,def:25},taille:{title:"Taille",unit:"cm",min:100,max:230,def:170},cible:{title:"Poids objectif",unit:"kg",min:30,max:250,dec:TEN,def:70}};
function wP(k){const c=PCFG[k];wheel({title:c.title,unit:c.unit,min:c.min,max:c.max,dec:c.dec||null,val:P()[k],def:c.def,clear:true,onOk:v=>setP(k,v)})}
function wW(w){const ws=wk().filter(x=>BW()[x]!=null);const last=ws.length?BW()[ws[ws.length-1]]:null;wheel({title:"Poids · semaine "+w,unit:"kg",min:30,max:250,dec:TEN,val:BW()[w],def:last!=null?last:70,clear:true,onOk:v=>setW(w,v)})}
function phys(){const p=P(),T=+p.taille||0,ws=wk(),have=ws.filter(w=>BW()[w]!=null);
 const first=have.length?BW()[have[0]]:null,last=have.length?BW()[have[have.length-1]]:null,pr=have.length>1?BW()[have[have.length-2]]:null;
 const bm=bmi(last,T),[cl,cc]=cat(bm),cible=+p.cible||null;
 const rows=ws.map((w,i)=>{const v=BW()[w],b=bmi(v,T);let pv=null;for(let k=i-1;k>=0;k--){if(BW()[ws[k]]!=null){pv=BW()[ws[k]];break}}
  return `<tr><td>S${w}</td><td><button class="num ${v==null?'ph':''}" onclick="wW(${w})">${v!=null?f1(v):'–'}</button></td><td>${f1(b)}</td><td>${v!=null&&pv!=null?delta(v-pv):'–'}</td></tr>`}).join("");
 $("m").innerHTML=`${back()}<div class="title">Mon <span>physique</span></div>
 <div class="card"><h3 style="margin-bottom:10px">Profil</h3><div class="grid2">
  <label>Prénom<input value="${esc(p.prenom)}" onchange="setP('prenom',this.value)"></label><label>Nom<input value="${esc(p.nom)}" onchange="setP('nom',this.value)"></label>
  <label>Âge<button class="num ${p.age===''?'ph':''}" onclick="wP('age')">${p.age!==''?p.age:'–'}</button></label><label>Taille (cm)<button class="num ${p.taille===''?'ph':''}" onclick="wP('taille')">${p.taille!==''?p.taille:'–'}</button></label>
  <label>Poids objectif (kg)<button class="num ${p.cible===''?'ph':''}" onclick="wP('cible')">${p.cible!==''?fmt(p.cible):'–'}</button></label></div></div>
 <div class="card"><h3 style="margin-bottom:10px">${p.prenom||p.nom?esc((p.prenom+" "+p.nom).trim())+" – ":""}Synthèse</h3>
  ${T&&last!=null?`<div class="kpi"><div><small>Poids actuel</small><b>${f1(last)} kg</b></div><div><small>IMC</small><b>${f1(bm)}</b></div><div><small>Depuis le début</small><b>${delta(last-first)}</b></div><div><small>Vs semaine préc.</small><b>${pr!=null?delta(last-pr):'–'}</b></div>${cible?`<div><small>Reste vers objectif</small><b>${f1(Math.abs(last-cible))} kg</b></div>`:""}</div>
  <p><span class="tag" style="background:${cc}">${cl}</span></p><p class="hint">IMC = poids ÷ taille² (OMS). Indicatif : l’IMC ne distingue pas muscle et graisse.</p>`:`<div class="hint">Renseigne ta taille et au moins un poids pour voir ton IMC.</div>`}</div>
 <div class="card"><h3 style="margin-bottom:10px">Poids par semaine</h3><table><tr><th>Sem.</th><th>Poids (kg)</th><th>IMC</th><th>Variation</th></tr>${rows}</table></div>
 <div class="card"><h3 style="margin-bottom:10px">Évolution</h3><div class="wkbar"><select id="bm" onchange="drawBody()"><option value="w">Poids (kg)</option><option value="i">IMC</option></select></div><canvas id="bc" width="760" height="240"></canvas></div>`;drawBody()}
function drawBody(){const T=+P().taille||0,m=$("bm").value;const pts=wk().filter(w=>BW()[w]!=null).map(w=>["S"+w,m=="w"?BW()[w]:(T?Math.round(bmi(BW()[w],T)*10)/10:null)]).filter(p=>p[1]!=null);drawLine("bc",pts,false)}

/* ---------- photos de progression (stockées sur l'appareil) ---------- */
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open("diary2-photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("p",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function pdb(mode,fn){const db=await idb();return new Promise((ok,no)=>{const t=db.transaction("p",mode),rq=fn(t.objectStore("p"));t.oncomplete=()=>ok(rq&&rq.result);t.onerror=()=>no(t.error)})}
function shrink(file){return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const r=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?ok(b):no()},"image/jpeg",.85)};img.onerror=()=>no();img.src=u})}
let CMP=[],PU=[];
function photosPage(){$("m").innerHTML=`${back()}<div class="title">Photos de <span>progression</span></div>
 <div class="card"><div class="grid2"><label>Date<input type="date" id="phd" value="${today()}"></label><label>Photo<input type="file" id="phf" accept="image/*" onchange="addPhoto(this)"></label></div>
 <p class="hint">Les photos restent sur cet appareil (non envoyées sur Internet). Touche « Comparer » sur deux photos pour les voir côte à côte.</p></div>
 <div id="cmpbox"></div><div class="card"><div class="pg" id="pgl"><span class="hint">Chargement…</span></div></div>`;loadPhotos()}
async function addPhoto(inp){const f=inp.files[0];if(!f)return;try{const b=await shrink(f);await pdb("readwrite",s=>s.put({id:Date.now()+"-"+Math.random().toString(36).slice(2,8),date:$("phd").value||today(),blob:b}));toast("Photo ajoutée","camera");loadPhotos()}catch(e){toast("Impossible d’enregistrer la photo","warn")}inp.value=""}
async function loadPhotos(){try{const list=((await pdb("readonly",s=>s.getAll()))||[]).sort((a,b)=>b.date.localeCompare(a.date));PU.forEach(u=>URL.revokeObjectURL(u));PU=[];ZL=[];
 const urls={};list.forEach(p=>{urls[p.id]=URL.createObjectURL(p.blob);PU.push(urls[p.id]);ZL.push(urls[p.id])});
 if(!list.length){$("pgl").innerHTML='<span class="hint">Aucune photo pour le moment.</span>';$("cmpbox").innerHTML="";return}
 $("pgl").innerHTML=list.map((p,i)=>`<div class="pgi ${CMP.includes(p.id)?'sel':''}"><img alt="Photo du ${p.date}" src="${urls[p.id]}" onclick="zoom(${i},'${p.date}')"><p>${frd(p.date)}</p><button class="btn sm" style="width:100%;margin-bottom:6px" data-id="${p.id}" onclick="cmpPick(this.dataset.id)">${CMP.includes(p.id)?'Choisie':'Comparer'}</button><button class="btn sm r" style="width:100%" data-id="${p.id}" onclick="delPhoto(this.dataset.id)">Supprimer</button></div>`).join("");
 const a=list.find(p=>p.id===CMP[0]),b=list.find(p=>p.id===CMP[1]);
 $("cmpbox").innerHTML=a&&b?`<div class="card"><h3 style="margin-bottom:10px">Comparaison</h3><div class="cmp"><div><img alt="" src="${urls[a.id]}"><p class="hint" style="text-align:center">${frd(a.date)}</p></div><div><img alt="" src="${urls[b.id]}"><p class="hint" style="text-align:center">${frd(b.date)}</p></div></div></div>`:""}catch(e){$("pgl").innerHTML='<span class="hint">Stockage des photos indisponible sur ce navigateur.</span>'}}
function cmpPick(id){CMP=CMP.includes(id)?CMP.filter(x=>x!==id):[...CMP,id].slice(-2);loadPhotos()}
async function delPhoto(id){if(!confirm("Supprimer cette photo ?"))return;try{await pdb("readwrite",s=>s.delete(id));CMP=CMP.filter(x=>x!==id);loadPhotos()}catch(e){toast("Suppression impossible","warn")}}

/* ---------- rappels (appli ouverte) ---------- */
const DN=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
function remPage(){const r=D.settings.rem;$("m").innerHTML=`${back()}<div class="title">Rappels d’<span>entraînement</span></div>
 <div class="card"><div class="tip o">${ic("warn",20)}<div>Le rappel s’affiche quand l’application est ouverte (ou en arrière-plan sur certains téléphones, si les notifications sont autorisées). Il ne remplace pas une alarme : la fermeture complète de l’appli peut l’empêcher.</div></div>
 <label class="hint">Heure<input type="time" id="rt" value="${r.time}" onchange="D.settings.rem.time=this.value;save()"></label>
 <p class="hint" style="margin-top:12px">Jours</p><div style="display:flex;flex-wrap:wrap;gap:12px">${[1,2,3,4,5,6,0].map(i=>`<label style="display:flex;align-items:center;gap:6px"><input type="checkbox" ${r.days.includes(i)?'checked':''} onchange="remDay(${i},this.checked)">${DN[i]}</label>`).join("")}</div>
 <button class="btn ${r.on?'':'g'} big" onclick="remToggle()">${r.on?'Désactiver les rappels':'Activer les rappels'}</button><p class="hint" id="rs"></p></div>`}
function remDay(i,v){const r=D.settings.rem;r.days=v?[...new Set([...r.days,i])]:r.days.filter(x=>x!==i);save()}
async function remToggle(){const r=D.settings.rem;r.on=!r.on;save();if(r.on&&"Notification"in window&&Notification.permission==="default"){try{await Notification.requestPermission()}catch(e){}}
 remPage();const s=$("rs");if(s&&r.on)s.textContent="Notifications : "+(("Notification"in window)?Notification.permission==="granted"?"autorisées":"non autorisées (message dans l’appli uniquement)":"non disponibles sur ce navigateur")}
setInterval(async()=>{const r=D.settings.rem,d=new Date(),h=p2(d.getHours())+":"+p2(d.getMinutes());if(!r.on||!r.days.includes(d.getDay())||h!==r.time||r.last===today())return;r.last=today();save();
 toast("C’est l’heure de ton entraînement !","dumbbell");try{if("Notification"in window&&Notification.permission==="granted"){const reg=await navigator.serviceWorker.ready;reg.showNotification("Diary Muscu",{body:"C’est l’heure de ton entraînement !",icon:"../icon-192.png"})}}catch(e){}},20000);

/* ---------- réglages / écran allumé ---------- */
let lock=null;
async function applyWake(){try{if(D.settings.wake&&document.visibilityState==="visible"&&"wakeLock"in navigator){if(!lock||lock.released)lock=await navigator.wakeLock.request("screen")}else if(lock){await lock.release();lock=null}}catch(e){}}
document.addEventListener("visibilitychange",applyWake);
function wGoal(){wheel({title:"Séances par semaine",unit:"séances",min:1,max:7,dec:null,val:D.settings.goal,def:3,clear:false,onOk:v=>{D.settings.goal=v;save();hdr();setPage()}})}
function setPage(){const s=D.settings,sup="wakeLock"in navigator;
 $("m").innerHTML=`${back()}<div class="title"><span>Réglages</span></div>
 <div class="card"><h3 style="margin-bottom:8px">Objectif hebdomadaire</h3><button class="num" onclick="wGoal()">${plural(s.goal,"séance","séances")} par semaine</button>
 <p class="hint">Ta série compte les semaines consécutives où tu atteins cet objectif. Les jours de repos prévus ne la cassent pas.</p></div>
 <div class="card"><h3 style="margin-bottom:8px">Écran allumé pendant l’entraînement</h3><button class="btn ${s.wake?'':'g'} big" style="margin-top:0" onclick="D.settings.wake=!D.settings.wake;save();applyWake();setPage()">${s.wake?'Désactiver':'Activer'}</button>
 <p class="hint">${sup?"Fonction disponible sur ce navigateur. Elle se réactive quand tu reviens sur l’application.":"Non disponible sur ce navigateur."}</p></div>
 <div class="card"><h3 style="margin-bottom:8px">Zone sensible</h3><button class="btn r big" style="margin-top:0" onclick="if(confirm('Effacer toutes les données de cette version ? (Ton ancienne appli n’est pas touchée.)')){localStorage.removeItem(KEY);location.reload()}">Réinitialiser cette version</button></div>`}

if(typeof history!=="undefined"&&history.replaceState)history.replaceState({m:"log"},"");
$("lbp").innerHTML=ic("chevL",20);$("lbn").innerHTML=ic("chevR",20);
render();applyWake();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
