<style>
:root{--bg:#f6f4fc;--card:#ffffff;--bd:#ddd6f0;--tx:#1b1530;--mut:#6b6385;--g:#7c4ff0;--gd:#5b34c4;--v2:#6d3fd6;--b:#5b5fe0;--bdk:#4547b8;--o:#e8691f;--od:#b8500f;--y:#d99a06;--r:#d93a4f;--rd:#b02a3d;--onv:#fff;--tipb:#2b2f6b;--tipo:#6b3410;--tipg:#3b1f8a;--ovbg:rgba(246,244,252,.97);--bdw:#c9c0e4}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}html.dark{color-scheme:dark}
body{margin:0;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:700;background:var(--bg);color:var(--tx);line-height:1.35}

.brand{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:17px;letter-spacing:.5px;color:var(--v2);white-space:nowrap}

.tab{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border-radius:16px;border:2px solid transparent;background:none;color:var(--mut);font:inherit;font-weight:900;font-size:11px;letter-spacing:.3px;cursor:pointer}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:900;text-transform:uppercase;letter-spacing:.8px;font-size:15px;padding:13px 18px;border-radius:16px;border:2px solid var(--bd);border-bottom-width:4px;background:var(--card);color:var(--v2);cursor:pointer;transition:transform .05s}

input,select,textarea{font:inherit;font-weight:800;color:var(--tx);background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding:11px 12px;width:100%;min-width:0}

.prow{display:flex;align-items:center;gap:10px;margin:8px 0 14px}.prow .hint{white-space:nowrap}

.ckb.on{background:var(--g);border-color:var(--gd);color:#fff}
.chk{border-left:6px solid var(--o)}.chk.st2{border-left-color:var(--b)}
.chk.open{border-color:var(--v2)}.chk .exh .st{background:transparent}.chk .exh .st .ic{color:var(--o)}.chk.st2 .exh .st .ic{color:var(--b)}
.wr{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px solid var(--bd);cursor:pointer}
.wr:first-child{border-top:0}.wr .wtx{flex:1;font-weight:800;font-size:14px}.wr .wtx small{display:block;color:var(--mut);font-size:12px;margin-top:2px}

.finc{display:flex;justify-content:space-between;align-items:center;gap:10px;border-color:var(--g);color:var(--v2);font-weight:900}

.dots{display:flex;justify-content:center;gap:8px;margin:12px 0}.dots i{width:26px;height:26px;border-radius:50%;background:var(--bd);display:block}.dots i.on{background:var(--o);box-shadow:0 0 12px rgba(255,138,61,.6)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}

.bd.off{opacity:.45}.bd.off .bdi{background:var(--bd);box-shadow:0 4px 0 var(--bdw);color:var(--mut)}.bd.on{border-color:var(--y)}
.h3i{display:flex;align-items:center;gap:8px;margin-bottom:8px}.h3i .ic{color:var(--y)}
.rec{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:2px solid var(--bd)}.rec:first-of-type{border-top:0}

.menu{padding:6px 14px}
.mrow{width:100%;display:flex;align-items:center;gap:14px;padding:14px 0;border:0;border-top:2px solid var(--bd);background:none;color:var(--tx);font:inherit;font-weight:900;font-size:16px;text-align:left;cursor:pointer}
.mrow:first-child{border-top:0}.mrow .mi{width:42px;height:42px;border-radius:14px;background:rgba(139,92,246,.16);color:var(--v2);display:flex;align-items:center;justify-content:center;flex:none}
.mrow span.t{flex:1}.mrow small{display:block;color:var(--mut);font-size:12px;font-weight:700;margin-top:2px}.mrow .ch{color:var(--mut)}
.prof{display:flex;gap:14px;align-items:center}.prof .pn{font-size:21px;font-weight:900}
.rest{text-align:center;color:var(--mut)}.rest .ic{color:var(--v2);margin-bottom:6px}
canvas{width:100%;height:auto;background:var(--bg);border-radius:16px;border:2px solid var(--bd);display:block}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.pk div{background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding:10px;text-align:center;font-size:12px;color:var(--mut)}.pk b{display:block;color:var(--tx);font-size:20px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.kpi div{background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding:10px;text-align:center}.kpi small{display:block;color:var(--mut);font-size:11px;margin-bottom:4px}.kpi b{font-size:19px}
.tag{display:inline-block;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:900;color:#15121f}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--mut);font-size:11px;padding:4px}td{padding:6px 4px;border-top:2px solid var(--bd);text-align:center}td .num{width:100px}
.up{color:var(--o)}.dn{color:var(--v2)}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.big2 img,.pg img{width:100%;border-radius:14px;background:#262b35;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in}
.imgcap{text-align:center;margin:6px 0;color:var(--mut);font-size:12px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.pg img{aspect-ratio:3/4}
.pgi{background:var(--bg);border:2px solid var(--bd);border-radius:16px;padding:8px}.pgi.sel{border-color:var(--g)}.pgi p{margin:6px 0;text-align:center;font-size:13px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmp img{width:100%;border-radius:14px;aspect-ratio:3/4;object-fit:cover}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-30px);opacity:0;z-index:130;background:var(--card);border:2px solid var(--y);border-radius:16px;padding:12px 16px;max-width:90vw;font-weight:900;pointer-events:none;transition:all .3s;text-align:center;display:flex;gap:8px;align-items:center}
#toast .ic{color:var(--y)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ov{display:none;position:fixed;inset:0;z-index:70;background:var(--ovbg);align-items:center;justify-content:center;padding:20px;overflow-y:auto}.ov.open{display:flex}
.cele{text-align:center;max-width:380px;width:100%}.cele h2{font-size:30px;color:var(--v2);margin:10px 0}

.sheet{align-self:flex-end;width:100%;max-width:560px;margin:auto;background:var(--card);border:2px solid var(--bd);border-radius:24px;padding:16px;position:relative;max-height:90vh;overflow-y:auto}

#lb{z-index:100;flex-direction:column;gap:10px;background:rgba(0,0,0,.94)}

.wcols{position:relative;display:flex;justify-content:center;gap:4px;height:220px;margin:8px 0 14px}

.wbtn{display:flex;gap:10px}.wbtn .btn{flex:1}
.rbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:24;width:calc(100% - 20px);max-width:700px;display:none;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border:2px solid var(--g);border-radius:18px;box-shadow:0 6px 22px rgba(0,0,0,.28)}
.rbar.on{display:flex}.rbar .rt{flex:1;min-width:0}.rbar .rt small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>

const DAYS=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"],DL={Lun:"L",Mar:"M",Mer:"M",Jeu:"J",Ven:"V",Sam:"S",Dim:"D"};

const frd=s=>{const[a,b,c]=s.split("-");return c+"/"+b+"/"+a};

/* ---------- jeu d'icônes dessiné pour l'appli ---------- */
const IC={
 dumbbell:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',

 bolt:'<path d="M13 3L5.5 13.5H11L10 21l8-11h-5.5z"/>',

 thermo:'<path d="M10 14.5V5a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0z"/><path d="M12 9v7"/>',
 lotus:'<path d="M12 4c2.4 3.2 2.4 8 0 12-2.4-4-2.4-8.8 0-12z"/><path d="M4.5 10.5c4 0 6.5 2 7.5 5.5M19.5 10.5c-4 0-6.5 2-7.5 5.5"/><path d="M5 19.5h14"/>',
 bulb:'<path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.5 10.8c.6.5 1 1.2 1 2.2h5c0-1 .4-1.7 1-2.2A6 6 0 0 0 12 3z"/>',

 chevR:'<path d="M9 5l7 7-7 7"/>',chevL:'<path d="M15 5l-7 7 7 7"/>',chevD:'<path d="M5 9l7 7 7-7"/>',chevU:'<path d="M5 15l7-7 7 7"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',play:'<path d="M7 5l12 7-12 7z"/>',pause:'<path d="M8 5v14M16 5v14"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'
};
const ic=(n,s=22,x="")=>`<svg class="ic ${x}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||""}</svg>`;

/* ---------- programme ---------- */
const E=(n,s,t)=>({n,t,sets:Array.from({length:s},()=>({kg:"",reps:"",ok:false}))});
const TPL={
 FA:()=>({name:"Full body A",ex:[E("Tirage poitrine",3,"12-15"),E("Chest press",3,"12-15"),E("Presse à cuisses",3,"12-15"),E("Développé épaules machine",3,"12-15"),E("Curl",3,"12-15"),E("Gainage (s)",3,"30-40")]}),
 FB:()=>({name:"Full body B",ex:[E("Rowing poulie basse",3,"12-15"),E("Développé couché haltères",3,"12-15"),E("Fente arrière",3,"12"),E("Oiseau (pec deck inversé)",3,"15"),E("Triceps poulie",3,"12-15")]}),
 HA:()=>({name:"Haut A (pousser)",ex:[E("Développé couché haltères",4,"8-12"),E("Rowing unilatéral",3,"10-12"),E("Développé épaules assis",3,"8-12"),E("Curl haltères",2,"12-15")]}),
 BA:()=>({name:"Bas",ex:[E("Squat ou presse",3,"8-12"),E("Soulevé de terre roumain léger",3,"10"),E("Leg curl",3,"12"),E("Mollets",3,"15"),E("Gainage (s)",3,"40")]}),
 HB:()=>({name:"Haut B (tirer)",ex:[E("Tractions / tirage vertical",4,"8-10"),E("Pompes / développé incliné",3,"8-15"),E("Rowing buste penché",3,"10-12"),E("Élévations latérales",3,"12-15"),E("Extension triceps",2,"12-15")]}),
 HC:()=>({name:"Haut C (épaules/bras)",ex:[E("Développé militaire",3,"8-10"),E("Élévations latérales",4,"12-15"),E("Oiseau",3,"15"),E("Dips",3,"8-12"),E("Curl incliné",3,"10-12")]})
};
function makeWeek(w){const d={};DAYS.forEach(x=>d[x]={name:"Repos",ex:[]});const set=(day,k)=>d[day]=TPL[k]();
 if(w<=2){set("Mar","FA");set("Jeu","FB");set("Sam","FA")}else{set("Lun","HA");set("Mar","BA");set("Jeu","HB");set("Sam","HC")}return d}

/* ---------- données (copie unique depuis l'ancienne appli, sans la modifier) ---------- */
let D=null;
try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!D){try{const o=JSON.parse(localStorage.getItem(OLD));if(o&&o.weeks)D=o}catch(e){}}
if(!D){D={weeks:{}};for(let w=1;w<=6;w++)D.weeks[w]=makeWeek(w)}
D.done=D.done||{};D.state=D.state||{};D.imgs=D.imgs||{};D.warm=D.warm||{};D.stretch=D.stretch||{};D.wlist=D.wlist||{};D.slist=D.slist||{};D.chr=D.chr||{};D.sxp=D.sxp||{};
if(D.imgv!==IMGV){D.imgs={};D.imgv=IMGV}
D.body=D.body||{p:{prenom:"",nom:"",age:"",taille:"",cible:""},w:{}};
D.sessions=D.sessions||{};D.badges=D.badges||{};D.best=D.best||0;D.recs=D.recs||0;
D.settings=Object.assign({goal:3,wake:false,dark:false,rest:90,restEx:120,snd:true,lang:"fr"},D.settings||{});
D.settings.rest=Math.min(360,Math.max(90,+D.settings.rest||90));D.settings.restEx=Math.min(360,Math.max(120,+D.settings.restEx||120));
{const _l=D.settings.lang;if(_l==="en")Object.assign(DL,{Lun:"M",Mar:"T",Mer:"W",Jeu:"T",Ven:"F",Sam:"S",Dim:"S"});if(_l==="de")Object.assign(DL,{Lun:"M",Mar:"D",Mer:"M",Jeu:"D",Ven:"F",Sam:"S",Dim:"S"})}
D.settings.rem=Object.assign({on:false,days:[2,4,6],time:"18:00",last:""},D.settings.rem||{});
const wk=()=>Object.keys(D.weeks).map(Number).sort((a,b)=>a-b);
const todayDay=()=>DAYS[(new Date().getDay()+6)%7];
let mode="log",W=+D.state.week||wk()[0],day=todayDay(),OPEN=null;
if(!D.weeks[W])W=wk()[0];
if(!D.weeks[W][day])day="Mar";
const cd=()=>D.weeks[W][day];
const dayKey=(w,d)=>w+"|"+d;

function save(){D.state={week:W,day};try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast("Stockage plein sur cet appareil","warn")}}

/* ---------- mascotte originale : l'ourson Bobo ---------- */
function mascot(s,mood){const mouth=mood==="happy"?'<path d="M42 68 Q50 80 58 68 Z" fill="#2a1d4e"/><path d="M46 74 Q50 77 54 74 Q50 72 46 74 Z" fill="#f472b6"/>':'<path d="M44 69 Q50 74 56 69" stroke="#2a1d4e" stroke-width="3.5" fill="none" stroke-linecap="round"/>';
 return `<svg width="${s}" height="${s}" viewBox="0 0 100 100" aria-hidden="true"><circle cx="24" cy="30" r="13" fill="#7c4ff0"/><circle cx="24" cy="30" r="7" fill="#c4b5fd"/><circle cx="76" cy="30" r="13" fill="#7c4ff0"/><circle cx="76" cy="30" r="7" fill="#c4b5fd"/><circle cx="50" cy="56" r="35" fill="#8b5cf6"/><path d="M16 45Q50 28 84 45L85 54Q50 37 15 54Z" fill="#fbbf24"/><ellipse cx="50" cy="68" rx="17" ry="13" fill="#ddd6fe"/><circle cx="37" cy="59" r="5" fill="#2a1d4e"/><circle cx="63" cy="59" r="5" fill="#2a1d4e"/><circle cx="38.5" cy="57.5" r="1.6" fill="#fff"/><circle cx="64.5" cy="57.5" r="1.6" fill="#fff"/><ellipse cx="50" cy="64.5" rx="5" ry="3.5" fill="#2a1d4e"/>${mouth}<circle cx="27" cy="67" r="4.5" fill="#f472b6" opacity=".45"/><circle cx="73" cy="67" r="4.5" fill="#f472b6" opacity=".45"/></svg>`}

/* ---------- stats, série, XP, badges ---------- */
function wstart(ds){const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function streak(){const cnt={};Object.values(D.sessions).forEach(ds=>{const w=wstart(ds);cnt[w]=(cnt[w]||0)+1});
 const goal=D.settings.goal,cur=wstart(today());let n=(cnt[cur]||0)>=goal?1:0;const dd=new Date(cur+"T12:00:00");
 for(let i=0;i<520;i++){dd.setDate(dd.getDate()-7);if((cnt[iso(dd)]||0)>=goal)n++;else break}
 return{n,cnt,goal,thisWeek:cnt[cur]||0}}
function xpOf(k){if(D.sxp&&D.sxp[k]!=null)return D.sxp[k];const a=k.split("|"),x=D.weeks[a[0]]&&D.weeks[a[0]][a[1]];if(!x)return 50;let n=0;x.ex.forEach(e=>e.sets.forEach(s=>{if(done(s))n++}));return n*10+50}
function stats(){let sets=0;wk().forEach(w=>DAYS.forEach(d=>D.weeks[w][d].ex.forEach(e=>e.sets.forEach(s=>{if(done(s))sets++}))));
 const sessions=Object.keys(D.sessions).length,xp=Object.keys(D.sessions).reduce((a,k)=>a+xpOf(k),0),st=streak();
 return{sets,sessions,xp,level:Math.floor(xp/300)+1,into:xp%300,streak:st.n,week:st.thisWeek,goal:st.goal,cnt:st.cnt}}
const BADGES=[
 ["first","target","Premier pas","1re séance terminée",c=>c.sessions>=1],["s5","dumbbell","Habitué","5 séances",c=>c.sessions>=5],
 ["s10","medal","Régulier","10 séances",c=>c.sessions>=10],["s25","trophy","Athlète","25 séances",c=>c.sessions>=25],
 ["w2","flame","Sur la lancée","2 semaines d’affilée",c=>c.best>=2],["w4","star","Un mois de feu","4 semaines d’affilée",c=>c.best>=4],
 ["w8","mountain","Inarrêtable","8 semaines d’affilée",c=>c.best>=8],["w12","crown","Légende","12 semaines d’affilée",c=>c.best>=12],
 ["k100","check","100 séries","100 séries validées",c=>c.sets>=100],["k500","diamond","500 séries","500 séries validées",c=>c.sets>=500],
 ["r1","trend","Premier record","Bats un record",c=>c.recs>=1],["lv5","bolt","Niveau 5","Atteins le niveau 5",c=>c.level>=5]];
function checkBadges(){const st=stats();D.best=Math.max(D.best,st.streak);const c=Object.assign({},st,{best:D.best,recs:D.recs}),n=[];
 BADGES.forEach(b=>{if(!D.badges[b[0]]&&b[4](c)){D.badges[b[0]]=today();n.push(b)}});return n}

/* ---------- records ---------- */
function recMap(){const m={};wk().forEach(w=>DAYS.forEach(d=>D.weeks[w][d].ex.forEach(e=>e.sets.forEach(s=>{if(!done(s)||!(+s.reps>0))return;
 const r=m[e.n]||(m[e.n]={kg:0,reps:0,max:0});const kg=+s.kg||0;r.max=Math.max(r.max,+s.reps);
 if(kg>r.kg||(kg===r.kg&&+s.reps>r.reps)){r.kg=kg;r.reps=+s.reps}}))));return m}
function isRecord(ex,set){const kg=+set.kg||0,reps=+set.reps||0;if(!reps)return false;let any=false,mk=0,mr=0,mx=0;
 wk().forEach(w=>DAYS.forEach(d=>D.weeks[w][d].ex.forEach(e=>{if(e.n!==ex.n)return;e.sets.forEach(s=>{if(s===set||!done(s)||!(+s.reps>0))return;any=true;const k=+s.kg||0;mx=Math.max(mx,+s.reps);
  if(k>mk||(k===mk&&+s.reps>mr)){mk=k;mr=+s.reps}})})));
 if(!any)return false;return /gainage/i.test(ex.n)?reps>mx:(kg>mk||(kg===mk&&reps>mr))}
const recText=(n,s)=>/gainage/i.test(n)?s.reps+" s":((+s.kg||0)>0?fmt(s.kg)+" kg × "+s.reps:s.reps+" reps");

/* ---------- toast / célébration / confettis ---------- */
let tt;function toast(m,icn){const t=$("toast");t.innerHTML=(icn?ic(icn,20):"")+"<span>"+esc(m)+"</span>";t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),3800)}
function confetti(){const c=["#8b5cf6","#c4b5fd","#fbbf24","#f472b6","#818cf8","#ff8a3d"];for(let i=0;i<46;i++){const e=document.createElement("div");e.className="cf";
 e.style.left=Math.random()*100+"vw";e.style.background=c[i%c.length];e.style.animationDuration=(1.8+Math.random()*1.8)+"s";e.style.animationDelay=(Math.random()*.5)+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),4500)}}
let CELE=null;
function celebrate(o){CELE=o;$("cele").innerHTML=`<div class="cele"><div class="mas">${mascot(130,"happy")}</div><h2>${o.title}</h2>${o.lines.map(l=>`<div class="ln">${ic(l[0],22)}<span>${l[1]}</span></div>`).join("")}<button class="btn g big" onclick="closeCele(true)">${o.btn||"Continuer"}</button>${o.btn2?`<button class="btn big" onclick="closeCele(false)">Rester ici</button>`:""}</div>`;
 $("cele").classList.add("open");confetti();if(navigator.vibrate)navigator.vibrate([60,40,60])}
function closeCele(go){$("cele").classList.remove("open");if(go&&CELE&&CELE.onok)CELE.onok();CELE=null}

/* ---------- roulette de nombres ---------- */
const TEN=Array.from({length:10},(_,i)=>i/10),QUA=[0,.25,.5,.75];
const decLab=d=>d===0?",0":","+String(d).split(".")[1];
let WV=null;
function wheel(o){const ints=[];for(let i=o.min;i<=o.max;i++)ints.push(i);
 let v=(o.val===""||o.val==null||isNaN(+o.val))?(o.def!=null?+o.def:o.min):+o.val;
 const maxv=o.max+(o.dec?o.dec[o.dec.length-1]:0);v=Math.min(Math.max(v,o.min),maxv);
 let ip=Math.floor(v+1e-9),di=0;if(o.dec){const fr=v-ip;let b=1e9;o.dec.forEach((d,j)=>{if(Math.abs(d-fr)<b){b=Math.abs(d-fr);di=j}})}
 ip=Math.min(Math.max(ip,o.min),o.max);WV={o,ints,ii:ip-o.min,di};
 const col=(id,arr,sel,lab,c)=>`<div class="wcol" id="${id}" onscroll="wsc(${c})">${arr.map((x,j)=>`<div class="${j==sel?'s':''}" onclick="wgo(${c},${j})">${lab(x)}</div>`).join("")}</div>`;
 $("wv").innerHTML=`<div class="wsheet" onclick="event.stopPropagation()"><div class="wt"><h3>${esc(o.title)}</h3><button class="xb" style="position:static" onclick="wclose()" aria-label="Fermer">${ic("x",18)}</button></div>
 <div class="wcols">${col("wc0",ints,WV.ii,x=>x,0)}${o.dec?col("wc1",o.dec,di,decLab,1):""}<span class="wunit">${o.unit||""}</span><div class="wband"></div></div>
 <div class="wbtn">${o.clear?'<button class="btn" onclick="wclear()">Effacer</button>':''}<button class="btn g" onclick="wok()">Valider</button></div></div>`;
 $("wv").classList.add("open");$("wc0").scrollTop=WV.ii*44;if(o.dec)$("wc1").scrollTop=di*44}
function wsc(c){if(!WV)return;const el=$("wc"+c),n=c?WV.o.dec.length:WV.ints.length;let i=Math.round(el.scrollTop/44);i=Math.max(0,Math.min(n-1,i));
 const k=c?"di":"ii";if(WV[k]!==i){const ch=el.children;if(ch&&ch[WV[k]])ch[WV[k]].classList.remove("s");if(ch&&ch[i])ch[i].classList.add("s");WV[k]=i;if(navigator.vibrate)navigator.vibrate(5)}}
function wgo(c,j){const el=$("wc"+c);if(el.scrollTo)el.scrollTo({top:j*44,behavior:"smooth"})}
function wok(){if(!WV)return;const o=WV.o;let v=WV.ints[WV.ii]+(o.dec?o.dec[WV.di]:0);v=Math.round(v*100)/100;wclose();o.onOk(v)}
function wclear(){if(!WV)return;const o=WV.o;wclose();o.onOk("")}
function wclose(){$("wv").classList.remove("open");WV=null}

/* ---------- navigation : barre d'icônes en bas ---------- */

 const full=p.sets.every(s=>done(s)&&+s.reps>=top),kg=Math.max(0,...p.sets.map(s=>+s.kg||0));
 if(full){if(sec)return `<div class="tip g">${ic("bulb",20)}<div>Objectif atteint la dernière fois (${top} s). Essaie ${top+5} s si ta posture reste parfaite.</div></div>`;

const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function drawLine(id,pts,zero=true){const c=$(id);if(!c)return;const x=c.getContext("2d"),w=c.width,h=c.height;x.clearRect(0,0,w,h);
 const fs=Math.max(11,Math.round(h/18)),pl=Math.round(w*.05),pr=Math.round(w*.04),pt=Math.round(h*.12),pb=Math.round(h*.14);x.font="800 "+fs+"px sans-serif";
 if(!pts.length){x.fillStyle=cssv("--mut");x.fillText("Pas encore de données",pl,pt+fs);return}
 let lo=Math.min(...pts.map(p=>p[1])),hi=Math.max(...pts.map(p=>p[1]));
 if(zero){lo=0;hi=hi*1.15||1}else{const pad=Math.max((hi-lo)*.25,.5);lo-=pad;hi+=pad}
 const X=i=>pl+(pts.length>1?i*((w-pl-pr)/(pts.length-1)):(w-pl-pr)/2),Y=v=>h-pb-(v-lo)/((hi-lo)||1)*(h-pt-pb);
 x.strokeStyle=cssv("--bd");x.lineWidth=2;for(let k=0;k<4;k++){const y=pt+k*(h-pt-pb)/3;x.beginPath();x.moveTo(pl-6,y);x.lineTo(w-pr+6,y);x.stroke()}
 x.strokeStyle="#8b5cf6";x.lineWidth=Math.max(4,h/60);x.lineJoin="round";x.lineCap="round";x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(i),Y(p[1])):x.moveTo(X(i),Y(p[1])));x.stroke();
 pts.forEach((p,i)=>{x.fillStyle="#8b5cf6";x.beginPath();x.arc(X(i),Y(p[1]),Math.max(5,h/45),0,7);x.fill();x.fillStyle=cssv("--tx");x.fillText(p[1],X(i)-fs*.7,Y(p[1])-fs*.9);x.fillStyle=cssv("--mut");x.fillText(p[0],X(i)-fs*.7,h-pb*.3)})}
function series(name,m){const pts=[];wk().forEach(w=>{let v=0,any=false;DAYS.forEach(d=>D.weeks[w][d].ex.filter(x=>x.n==name).forEach(x=>x.sets.forEach(s=>{
  if(done(s)&&s.reps!==""){any=true;const kg=s.kg===""?0:s.kg;if(m=="max")v=Math.max(v,kg);else v+=s.reps}})));if(any)pts.push(["S"+w,Math.round(v*10)/10])});return pts}
function pickEx(n){PEX=n;prog()}
function prog(){const s=new Set();wk().forEach(w=>DAYS.forEach(d=>D.weeks[w][d].ex.forEach(e=>s.add(e.n))));
 const names=[...s].filter(n=>series(n,"rep").length).sort((a,b)=>a.localeCompare(b,"fr",{sensitivity:"base"}));let h=`<div class="title">Mes <span>progrès</span></div>`+seg(PMN,PM,"subProg");
