<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIARY MUSCU</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diary Muscu">
<link rel="apple-touch-icon" href="icon-192.png">
<style>@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');</style>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--acc:#4ade80;--tx:#e8eaed;--mut:#8b919c;--bd:#2a2f3a;--red:#f87171;--org:#fbbf24}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);text-transform:uppercase;letter-spacing:.3px}
header{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-size:34px;letter-spacing:4px;text-align:center;font-weight:400;color:var(--acc);margin:0}
h3{margin:0 0 10px;font-size:16px}
main{max-width:820px;margin:auto;padding:12px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;text-transform:uppercase}
button{cursor:pointer}button.on{background:var(--acc);color:#05260f;border-color:var(--acc);font-weight:600}
button.x{color:var(--red);padding:4px 8px}button.pri{background:var(--acc);color:#05260f;font-weight:600;border-color:var(--acc)}
#burger{font-size:20px;padding:4px 10px;width:44px}
#veil{display:none;position:fixed;inset:0;background:#0009;z-index:9}
#side{position:fixed;top:0;left:0;bottom:0;width:230px;background:var(--card);border-right:1px solid var(--bd);transform:translateX(-100%);transition:transform .25s;z-index:10;padding:16px 12px;display:flex;flex-direction:column;gap:8px}
#side.open{transform:none}#veil.open{display:block}
#side .sh{font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;letter-spacing:3px;color:var(--mut);margin-bottom:8px}
#side button{text-align:left;padding:12px}
.scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.scroll button{white-space:nowrap}.dot::after{content:" ●";color:var(--acc);font-size:10px}
.on.dot::after{color:#05260f}
.wkbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.wkbar select{flex:1;font-weight:600;font-size:16px;padding:10px;min-width:0}
.wkbar button{padding:10px 14px}
.done{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:4px}
.done.ok{border-color:var(--acc)}
.done input{width:24px;height:24px;accent-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.top{display:flex;gap:6px;margin-bottom:8px}.top input{flex:1;min-width:0}.top .t{max-width:110px}
.ex-name{font-weight:600}
.set{display:grid;grid-template-columns:28px 1fr 1fr 34px 30px;gap:6px;align-items:center;margin-bottom:5px}
.set input{width:100%;text-align:center}.set input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.lbl{color:var(--mut);font-size:12px;text-align:center}.hint{color:var(--mut);font-size:13px}
.sum{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 12px;font-size:14px}.sum b{color:var(--acc)}
canvas{width:100%;height:auto;aspect-ratio:760/240;background:var(--bg);border-radius:12px;border:1px solid var(--bd)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px}.big img{width:100%;border-radius:10px;background:#262b35;aspect-ratio:4/3;object-fit:cover}
#res{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.gc{background:var(--bg);border:2px solid var(--bd);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.gc img{width:100%;aspect-ratio:1;object-fit:cover;background:#262b35;display:block}
.gc span{font-size:10px;padding:4px 5px;line-height:1.2;min-height:28px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut)}
.grid2 input{width:100%;font-size:15px;color:var(--tx)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kpi div{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}
.kpi small{display:block;color:var(--mut);font-size:11px;margin-bottom:4px}.kpi b{font-size:20px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#0f1115}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--mut);font-size:11px;text-align:center;padding:4px}
td{padding:5px 4px;border-top:1px solid var(--bd);text-align:center}td input{width:84px;text-align:center}
.up{color:var(--org)}.dn{color:var(--acc)}
details summary{cursor:pointer;font-weight:600}
</style></head><body>
<header><button id="burger" onclick="toggleMenu()" aria-label="Menu">☰</button><h1>DIARY MUSCU</h1><span></span></header>
<div id="veil" onclick="toggleMenu()"></div>
<aside id="side"><div class="sh">MENU</div>
<button id="bT" onclick="go('log')">🏋️ SÉANCES</button>
<button id="bP" onclick="go('prog')">📈 PROGRÈS</button>
<button id="bY" onclick="go('phys')">🧍 PHYSIQUE</button></aside>
<main id="m"></main>
<script>
const DAYS=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const E=(n,s,t)=>({n,t,sets:Array.from({length:s},()=>({kg:"",reps:"",ok:false}))});
const TPL={
 FA:()=>({name:"Full body A",ex:[E("Tirage poitrine",3,"12-15"),E("Chest press",3,"12-15"),E("Presse à cuisses",3,"12-15"),E("Développé épaules machine",3,"12-15"),E("Curl",3,"12-15"),E("Gainage (s)",3,"30-40")]}),
 FB:()=>({name:"Full body B",ex:[E("Rowing poulie basse",3,"12-15"),E("Développé couché haltères",3,"12-15"),E("Fente arrière",3,"12"),E("Oiseau (pec deck inversé)",3,"15"),E("Triceps poulie",3,"12-15")]}),
 HA:()=>({name:"Haut A (pousser)",ex:[E("Développé couché haltères",4,"8-12"),E("Rowing unilatéral",3,"10-12"),E("Développé épaules assis",3,"8-12"),E("Curl haltères",2,"12-15")]}),
 BA:()=>({name:"Bas",ex:[E("Squat ou presse",3,"8-12"),E("Soulevé de terre roumain léger",3,"10"),E("Leg curl",3,"12"),E("Mollets",3,"15"),E("Gainage (s)",3,"40")]}),
 HB:()=>({name:"Haut B (tirer)",ex:[E("Tractions / tirage vertical",4,"8-10"),E("Pompes / développé incliné",3,"8-15"),E("Rowing buste penché",3,"10-12"),E("Élévations latérales",3,"12-15"),E("Extension triceps",2,"12-15")]}),
 HC:()=>({name:"Haut C (épaules/bras)",ex:[E("Développé militaire",3,"8-10"),E("Élévations latérales",4,"12-15"),E("Oiseau",3,"15"),E("Dips",3,"8-12"),E("Curl incliné",3,"10-12")]})
};
function makeWeek(w){const d={};DAYS.forEach(x=>d[x]={name:"Repos",ex:[]});
 const set=(day,k)=>d[day]=TPL[k]();
 if(w<=2){set("Lun","FA");set("Mer","FB");set("Ven","FA")}
 else{set("Lun","HA");set("Mar","BA");set("Jeu","HB");set("Sam","HC")}
 return d}
let D=JSON.parse(localStorage.getItem("muscu2")||"null");
if(!D){D={weeks:{}};for(let w=1;w<=6;w++)D.weeks[w]=makeWeek(w)}
D.done=D.done||{};D.state=D.state||{};D.imgs=D.imgs||{};
D.body=D.body||{p:{prenom:"",nom:"",age:"",taille:"",cible:""},w:{}};
const wk=()=>Object.keys(D.weeks).map(Number).sort((a,b)=>a-b);
let mode="log",W=+D.state.week||wk()[0],day=D.state.day||"Lun";
if(!D.weeks[W])W=wk()[0];
if(D.done[W]){const n=wk().find(w=>!D.done[w]);if(n)W=n}
const save=()=>{D.state={week:W,day};localStorage.setItem("muscu2",JSON.stringify(D))};
const esc=s=>String(s).replace(/"/g,"&quot;");
function prev(w,ex){for(const x of wk().filter(k=>k<w).reverse())for(const dd of DAYS)for(const e of D.weeks[x][dd].ex)
  if(e.n===ex&&e.sets.some(s=>s.kg!==""||s.reps!==""))return e;return null}
function dayHas(w,d){return D.weeks[w][d].ex.some(e=>e.sets.some(s=>s.ok||s.reps!==""))}
function toggleMenu(){document.getElementById('side').classList.toggle('open');document.getElementById('veil').classList.toggle('open')}
function go(m){mode=m;toggleMenu();render()}
function render(){save();["bT","bP","bY"].forEach(i=>document.getElementById(i).className="");
 document.getElementById({log:"bT",prog:"bP",phys:"bY"}[mode]).className="on";({log,prog,phys})[mode]()}
function log(){
 let h=`<div class="wkbar"><select onchange="W=+this.value;render()">${wk().map(w=>`<option value="${w}" ${w==W?'selected':''}>Semaine ${w}${D.done[w]?' ✓':''}</option>`).join("")}</select><button onclick="addWeek()" title="Nouvelle semaine">＋</button></div>
 <div class="scroll">${DAYS.map(d=>`<button class="${d==day?'on':''} ${dayHas(W,d)?'dot':''}" onclick="day='${d}';render()">${d}</button>`).join("")}</div>`;
 const S=D.weeks[W][day];let vol=0,sets=0;S.ex.forEach(e=>e.sets.forEach(s=>{if(s.kg!==""&&s.reps!==""){vol+=s.kg*s.reps;sets++}}));
 h+=`<div class="top"><input value="${esc(S.name)}" onchange="D.weeks[W][day].name=this.value;save()" placeholder="Nom de la séance"><button class="x" onclick="clearDay()" title="Vider">🗑</button></div>
 <div class="sum"><span>Séries : <b>${sets}</b></span><span>Volume : <b>${vol}</b> kg</span></div>`;
 S.ex.forEach((e,i)=>{const p=prev(W,e.n);
  h+=`<div class="card"><div class="top"><input class="ex-name" value="${esc(e.n)}" onchange="upd(${i},'n',this.value)"><input class="t" value="${esc(e.t)}" onchange="upd(${i},'t',this.value)" placeholder="objectif"><button class="x" onclick="delEx(${i})">✕</button></div>
  <div class="set"><span></span><span class="lbl">kg</span><span class="lbl">reps</span><span class="lbl">✓</span><span></span></div>`;
  e.sets.forEach((s,k)=>{const q=p&&p.sets[k];
   h+=`<div class="set"><span class="lbl">${k+1}</span><input type="number" step="0.5" value="${s.kg}" placeholder="${q&&q.kg!==''?q.kg:''}" onchange="setv(${i},${k},'kg',this.value)"><input type="number" value="${s.reps}" placeholder="${q&&q.reps!==''?q.reps:''}" onchange="setv(${i},${k},'reps',this.value)"><input type="checkbox" ${s.ok?'checked':''} onchange="setv(${i},${k},'ok',this.checked)"><button class="x" onclick="delSet(${i},${k})">−</button></div>`});
  h+=`<button onclick="addSet(${i})">＋ série</button> ${p?`<span class="hint">Placeholders = semaine précédente</span>`:""}</div>`});
 h+=`<button class="pri" onclick="addEx()">＋ Ajouter un exercice</button>
 <label class="done ${D.done[W]?'ok':''}"><input type="checkbox" ${D.done[W]?'checked':''} onchange="markDone(this.checked)"><span>Semaine ${W} terminée</span></label>`;
 document.getElementById("m").innerHTML=h}
function markDone(v){D.done[W]=v;if(!v)delete D.done[W];
 if(v){const n=wk().find(w=>w>W&&!D.done[w])||wk().find(w=>!D.done[w]);if(n&&confirm("Semaine "+W+" terminée ! Passer à la semaine "+n+" ?")){W=n;day="Lun"}}
 render()}
const cd=()=>D.weeks[W][day];
function upd(i,f,v){cd().ex[i][f]=v;save();if(f=="n")render()}
function setv(i,k,f,v){cd().ex[i].sets[k][f]=(f=="ok")?v:(v===""?"":+v);save();render()}
function addSet(i){const s=cd().ex[i].sets,l=s[s.length-1]||{kg:"",reps:""};s.push({kg:l.kg,reps:"",ok:false});save();render()}
function delSet(i,k){cd().ex[i].sets.splice(k,1);save();render()}
function delEx(i){if(confirm("Supprimer cet exercice ?")){cd().ex.splice(i,1);save();render()}}
function addEx(){const n=prompt("Nom de l'exercice ?");if(n){cd().ex.push(E(n,3,""));save();render()}}
function clearDay(){if(confirm("Vider ce jour (repos) ?")){D.weeks[W][day]={name:"Repos",ex:[]};save();render()}}
function addWeek(){const n=Math.max(...wk())+1;D.weeks[n]=JSON.parse(JSON.stringify(D.weeks[n-1]));
 Object.values(D.weeks[n]).forEach(s=>s.ex.forEach(e=>e.sets.forEach(x=>{x.reps="";x.ok=false})));W=n;render()}

/* ---------- graphique générique ---------- */
function drawLine(id,pts,zero=true){const c=document.getElementById(id);if(!c)return;const x=c.getContext("2d");x.clearRect(0,0,760,240);
 if(!pts.length){x.fillStyle="#8b919c";x.font="14px sans-serif";x.fillText("PAS ENCORE DE DONNÉES",20,30);return}
 let lo=Math.min(...pts.map(p=>p[1])),hi=Math.max(...pts.map(p=>p[1]));
 if(zero){lo=0;hi=hi*1.15||1}else{const pad=Math.max((hi-lo)*.25,.5);lo-=pad;hi+=pad}
 const X=i=>50+(pts.length>1?i*(660/(pts.length-1)):330),Y=v=>205-(v-lo)/((hi-lo)||1)*170;
 x.strokeStyle="#2a2f3a";x.lineWidth=1;for(let k=0;k<4;k++){const y=35+k*170/3;x.beginPath();x.moveTo(40,y);x.lineTo(730,y);x.stroke()}
 x.strokeStyle="#4ade80";x.lineWidth=2.5;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(i),Y(p[1])):x.moveTo(X(i),Y(p[1])));x.stroke();
 x.font="12px sans-serif";pts.forEach((p,i)=>{x.fillStyle="#4ade80";x.beginPath();x.arc(X(i),Y(p[1]),4,0,7);x.fill();x.fillStyle="#e8eaed";x.fillText(p[1],X(i)-10,Y(p[1])-10);x.fillStyle="#8b919c";x.fillText(p[0],X(i)-8,226)})}

/* ---------- PROGRÈS : menu déroulant + images ---------- */
const IMG="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/";
const DBURL="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json";
const FR={"tirage poitrine":"lat pulldown","tirage vertical":"lat pulldown","traction":"pullups","chest press":"chest press","presse a cuisses":"leg press","presse":"leg press",
"developpe epaules machine":"machine shoulder press","developpe epaules assis":"seated dumbbell press","developpe militaire":"standing military press","developpe couche halteres":"dumbbell bench press",
"developpe incline":"incline dumbbell press","pompes":"pushups","curl incline":"incline dumbbell curl","curl halteres":"dumbbell bicep curl","curl":"barbell curl","gainage":"plank",
"rowing poulie basse":"seated cable rows","rowing unilateral":"one-arm dumbbell row","rowing buste penche":"bent over barbell row","fente arriere":"lunge","oiseau":"reverse flyes",
"triceps poulie":"triceps pushdown","extension triceps":"triceps pushdown","souleve de terre roumain":"romanian deadlift","squat":"barbell squat","leg curl":"lying leg curls",
"mollets":"standing calf raises","elevations laterales":"side lateral raise","dips":"dips triceps version"};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
let DB=null;
async function loadDB(){if(DB)return DB;const r=await fetch(DBURL);DB=await r.json();return DB}
function search(q,n=8){const t=norm(q).split(/[^a-z0-9]+/).filter(Boolean);if(!t.length)return[];
 return DB.map(e=>{const nm=norm(e.name),c=t.filter(w=>nm.includes(w)).length;return{e,c,l:nm.length+(e.category=="strength"?0:30)}})
  .filter(x=>x.c>0).sort((a,b)=>b.c-a.c||a.l-b.l).slice(0,n).map(x=>x.e)}
function guess(name){const k=norm(name);let q=null;
 for(const f of Object.keys(FR).sort((a,b)=>b.length-a.length)){if(k.includes(f)){q=FR[f];break}}
 const r=search(q||name,1);return r[0]?r[0].id:null}
let EXS=[],SEL=null;
function prog(){const s=new Set();wk().forEach(w=>DAYS.forEach(d=>D.weeks[w][d].ex.forEach(e=>s.add(e.n))));EXS=[...s];
 if(!EXS.includes(SEL))SEL=EXS[0]||null;
 document.getElementById("m").innerHTML=`<div class="wkbar"><select id="exsel" onchange="SEL=this.value;openEx()">${EXS.map(n=>`<option ${n==SEL?'selected':''}>${n}</option>`).join("")}</select></div>
 <div class="card"><div id="sel"></div><div class="bar"><select id="pm" onchange="draw()"><option value="max">Charge max</option><option value="vol">Volume</option><option value="rep">Reps totales</option></select></div><canvas id="cv" width="760" height="240"></canvas><div id="pr" class="hint" style="margin-top:8px"></div></div>`;
 openEx();resolveAll()}
function openEx(){showSel();draw()}
function showSel(){const el=document.getElementById("sel");if(!el||!SEL)return;const id=D.imgs[SEL];
 el.innerHTML=(id?`<div class="big"><img alt="" src="${IMG}${id}/0.jpg"><img alt="" src="${IMG}${id}/1.jpg"></div>`:`<div class="hint">Recherche de l'image…</div>`)+
 `<div class="bar"><button onclick="changeImg()">🔍 Changer l'image</button></div><div id="res"></div>`}
async function resolveAll(){try{for(const n of EXS){if(D.imgs[n])continue;await loadDB();const id=guess(n);
  if(id){D.imgs[n]=id;save();if(n==SEL)showSel()}}}
 catch(e){const el=document.getElementById("sel");if(el&&!D.imgs[SEL])el.innerHTML='<div class="hint">Images indisponibles (connexion requise)</div>'}}
async function changeImg(){const q=prompt("Mot-clé en anglais (ex : lat pulldown, bench press, plank)");if(!q)return;
 try{await loadDB()}catch{alert("Connexion requise");return}
 const r=search(q,12);document.getElementById("res").innerHTML=r.length?r.map(e=>`<div class="gc" data-id="${esc(e.id)}" onclick="pick(this.dataset.id)"><img loading="lazy" alt="" src="${IMG}${esc(e.id)}/0.jpg"><span>${e.name}</span></div>`).join(""):'<div class="hint">Aucun résultat</div>'}
function pick(id){D.imgs[SEL]=id;save();showSel()}
function draw(){const e=SEL,pmEl=document.getElementById("pm");if(!e||!pmEl)return;const m=pmEl.value,pts=[];
 wk().forEach(w=>{let v=0,any=false;DAYS.forEach(d=>D.weeks[w][d].ex.filter(x=>x.n==e).forEach(x=>x.sets.forEach(s=>{
  if(s.reps!==""){any=true;const kg=s.kg===""?0:s.kg;if(m=="max")v=Math.max(v,kg);else if(m=="vol")v+=kg*s.reps;else v+=s.reps}})));if(any)pts.push(["S"+w,v])});
 drawLine("cv",pts,true);
 document.getElementById("pr").textContent=pts.length?"Meilleur : "+Math.max(...pts.map(p=>p[1])):""}

/* ---------- PHYSIQUE ---------- */
const P=()=>D.body.p, BW=()=>D.body.w;
const bmi=(kg,cm)=>(kg&&cm)?kg/((cm/100)**2):null;
const f1=v=>v==null?"–":(Math.round(v*10)/10).toString().replace(".",",");
function cat(b){if(b==null)return["–","#8b919c"];if(b<18.5)return["Insuffisance pondérale","#60a5fa"];if(b<25)return["Corpulence normale","#4ade80"];if(b<30)return["Surpoids","#fbbf24"];return["Obésité","#f87171"]}
function delta(d){if(d==null||isNaN(d))return"–";const r=Math.round(d*10)/10;return r==0?"=":`<span class="${r>0?'up':'dn'}">${r>0?'▲ +':'▼ '}${f1(Math.abs(r)).replace(/^/,r<0?'-':'')}</span>`.replace("▼ --","▼ -")}
function setP(k,v){P()[k]=v;save();phys()}
function setW(w,v){if(v==="")delete BW()[w];else BW()[w]=+v;save();phys()}
function phys(){const p=P(),T=+p.taille||0,ws=wk(),have=ws.filter(w=>BW()[w]!=null);
 const first=have.length?BW()[have[0]]:null,last=have.length?BW()[have[have.length-1]]:null,pr=have.length>1?BW()[have[have.length-2]]:null;
 const bm=bmi(last,T),[cl,cc]=cat(bm),cible=+p.cible||null;
 const rows=ws.map((w,i)=>{const v=BW()[w],b=bmi(v,T);let pv=null;for(let k=i-1;k>=0;k--){if(BW()[ws[k]]!=null){pv=BW()[ws[k]];break}}
  return `<tr><td>S${w}</td><td><input type="number" step="0.1" value="${v??''}" placeholder="kg" onchange="setW(${w},this.value)"></td><td>${f1(b)}</td><td>${v!=null&&pv!=null?delta(v-pv):'–'}</td></tr>`}).join("");
 document.getElementById("m").innerHTML=`
 <div class="card"><h3>Profil</h3><div class="grid2">
  <label>Prénom<input value="${esc(p.prenom)}" onchange="setP('prenom',this.value)"></label>
  <label>Nom<input value="${esc(p.nom)}" onchange="setP('nom',this.value)"></label>
  <label>Âge<input type="number" value="${p.age}" onchange="setP('age',this.value)"></label>
  <label>Taille (cm)<input type="number" value="${p.taille}" onchange="setP('taille',this.value)"></label>
  <label>Poids objectif (kg)<input type="number" step="0.1" value="${p.cible}" onchange="setP('cible',this.value)"></label>
 </div></div>
 <div class="card"><h3>${p.prenom||p.nom?esc((p.prenom+" "+p.nom).trim())+" – ":""}Synthèse</h3>
  ${T&&last!=null?`<div class="kpi">
   <div><small>Poids actuel</small><b>${f1(last)} kg</b></div>
   <div><small>IMC</small><b>${f1(bm)}</b></div>
   <div><small>Depuis le début</small><b>${delta(last-first)}</b></div>
   <div><small>Vs semaine préc.</small><b>${pr!=null?delta(last-pr):'–'}</b></div>
   ${cible?`<div><small>Reste vers objectif</small><b>${f1(Math.abs(last-cible))} kg</b></div>`:""}
  </div><p style="margin:10px 0 0"><span class="tag" style="background:${cc}">${cl}</span></p>
  <p class="hint">IMC = poids ÷ taille² (OMS : &lt;18,5 insuffisance · 18,5–24,9 normal · 25–29,9 surpoids · ≥30 obésité). Indicatif : l'IMC ne distingue pas muscle et graisse.</p>`
  :`<div class="hint">Renseigne ta taille et au moins un poids pour voir ton IMC.</div>`}
 </div>
 <div class="card"><h3>Poids par semaine</h3>
  <table><tr><th>Sem.</th><th>Poids (kg)</th><th>IMC</th><th>Variation</th></tr>${rows}</table></div>
 <div class="card"><h3>Évolution</h3><div class="bar"><select id="bm" onchange="drawBody()"><option value="w">Poids (kg)</option><option value="i">IMC</option></select></div><canvas id="bc" width="760" height="240"></canvas></div>
 <div class="card"><details><summary>💾 Sauvegarde des données</summary><p class="hint">Les données restent dans ce navigateur. Exporte-les régulièrement.</p>

  <p class="hint">Images : free-exercise-db (domaine public)</p></details></div>`;
 drawBody()}
function drawBody(){const T=+P().taille||0,m=document.getElementById("bm").value;
 const pts=wk().filter(w=>BW()[w]!=null).map(w=>["S"+w,m=="w"?BW()[w]:(T?Math.round(bmi(BW()[w],T)*10)/10:null)]).filter(p=>p[1]!=null);
 drawLine("bc",pts,false)}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:"application/json"}));a.download="diary-muscu-"+new Date().toISOString().slice(0,10)+".json";a.click()}
function imp(i){const r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);D.done=D.done||{};D.state=D.state||{};D.imgs=D.imgs||{};D.body=D.body||{p:{prenom:"",nom:"",age:"",taille:"",cible:""},w:{}};W=wk()[0];save();alert("Importé ✅");render()}catch{alert("Fichier invalide")}};r.readAsText(i.files[0])}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
