<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIARY MUSCU</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diary Muscu">
<link rel="apple-touch-icon" href="icon-192.png">
<style>@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');</style>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--acc:#4ade80;--tx:#e8eaed;--mut:#8b919c;--bd:#2a2f3a;--red:#f87171;--org:#fbbf24;--blu:#60a5fa;--onacc:#05260f}
body.light{--bg:#f2f4f7;--card:#ffffff;--acc:#16a34a;--tx:#14171c;--mut:#5f6673;--bd:#d6dbe2;--onacc:#ffffff;--org:#b45309;--blu:#2563eb;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);text-transform:uppercase;letter-spacing:.3px}
header{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-size:34px;letter-spacing:4px;text-align:center;font-weight:400;color:var(--acc);margin:0}
h3{margin:0 0 10px;font-size:16px}
.pt{font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;letter-spacing:2px;font-weight:400;margin:2px 0 12px}.pt span{color:var(--acc)}
main{max-width:900px;margin:auto;padding:12px 12px 90px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;text-transform:uppercase}
textarea{width:100%;min-height:64px;text-transform:none;resize:vertical}
button{cursor:pointer}button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
button.x{color:var(--red);padding:4px 8px}button.pri{background:var(--acc);color:var(--onacc);font-weight:600;border-color:var(--acc)}
#burger{font-size:20px;padding:4px 10px;width:44px}
#veil{display:none;position:fixed;inset:0;background:#0009;z-index:9}
#side{position:fixed;top:0;left:0;bottom:0;width:250px;background:var(--card);border-right:1px solid var(--bd);transform:translateX(-100%);transition:transform .25s;z-index:10;padding:16px 12px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
#side.open{transform:none}#veil.open{display:block}
#side .sh{font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;letter-spacing:3px;color:var(--mut);margin-bottom:8px}
#side button{text-align:left;padding:12px;width:100%}
#side .grp{display:flex;justify-content:space-between;align-items:center}
#side .grp .chev{transition:transform .2s}#side .grp.open .chev{transform:rotate(180deg);color:var(--acc)}
#side .sub{display:none;flex-direction:column;gap:4px;margin:0 0 4px 14px;padding-left:10px;border-left:2px solid var(--bd)}
#side .sub.open{display:flex}
#side .sub button{padding:9px 12px;font-size:14px;background:var(--bg)}
.scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.scroll button{white-space:nowrap}.dot::after{content:" ●";color:var(--acc);font-size:10px}
.on.dot::after{color:var(--onacc)}
.wkbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.wkbar select{flex:1;font-weight:600;font-size:16px;padding:10px;min-width:0}
.wkbar button{padding:10px 14px}
.done{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:12px}
.done.ok{border-color:var(--acc)}
.done input{width:24px;height:24px;accent-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.ban{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--org);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.ban button{white-space:nowrap}
.sname{font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;letter-spacing:2px;margin:4px 0 2px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:6px;align-items:center;margin-bottom:5px}
.set input{width:100%;text-align:center}.set input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.lbl{color:var(--mut);font-size:12px;text-align:center}.hint{color:var(--mut);font-size:13px}
.tip{font-size:12px;color:var(--mut);text-transform:none;background:var(--bg);border-radius:8px;padding:8px 10px;margin:8px 0;line-height:1.4}
.tip b{color:var(--tx)}
.sug{font-size:13px;color:var(--org);margin:8px 0;text-transform:none;font-weight:600}
.sum{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 12px;font-size:14px}.sum b{color:var(--acc)}
canvas{width:100%;height:auto;background:var(--bg);border-radius:12px;border:1px solid var(--bd);display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.ac{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;overflow:hidden}
.ac.open{border-color:var(--acc)}.ac.fin .ah .cnt{color:var(--acc)}
.ac.wu{border-left:4px solid var(--org)}.ac.wu.open{border-color:var(--acc);border-left-color:var(--org)}
.ac.st{border-left:4px solid var(--blu)}.ac.st.open{border-color:var(--acc);border-left-color:var(--blu)}
.ah{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:0;padding:14px;font-weight:600;font-size:15px}
.ah small{display:block;color:var(--mut);font-weight:400;font-size:11px;margin-top:2px}
.ah .meta{display:flex;align-items:center;gap:10px;white-space:nowrap}.cnt{color:var(--mut);font-size:13px}
.chev{transition:transform .2s;color:var(--mut)}.ac.open .chev{transform:rotate(180deg);color:var(--acc)}
.ab{display:none;padding:0 14px 14px}.ac.open .ab{display:block}
.wr{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd);cursor:pointer}
.wr:first-child{border-top:0}
.wr input{width:24px;height:24px;accent-color:var(--acc);flex:none}
.wr span{font-size:14px;font-weight:600}.wr small{display:block;color:var(--mut);font-weight:400;font-size:11px;margin-top:2px}
.wr.ck span{color:var(--mut);text-decoration:line-through}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px}.big img{width:100%;border-radius:10px;background:#262b35;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in}
.zh{color:var(--mut);font-size:11px;margin-top:6px;text-align:center}
#lb{display:none;position:fixed;inset:0;background:#000e;z-index:50;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:10px}
#lb.open{display:flex}
#lb img{max-width:100%;max-height:calc(100vh - 130px);object-fit:contain;border-radius:8px;background:#262b35;touch-action:pinch-zoom}
#lb .lt{display:flex;gap:8px;align-items:center;width:100%;max-width:700px;justify-content:space-between}
#lb .lt button{padding:10px 16px;font-size:15px}
#lb .cap{font-size:13px;color:#aab;text-align:center}
#rt{display:none;position:fixed;left:12px;right:12px;bottom:12px;max-width:600px;margin:auto;z-index:20;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:10px 12px;box-shadow:0 6px 24px #0008}
#rt.fin{background:var(--acc);color:var(--onacc)}#rt b{font-size:20px}
#rt span button{padding:8px 10px}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pk div{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center;font-size:11px;color:var(--mut)}
.pk b{display:block;color:var(--tx);font-size:20px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut)}
.grid2 input,.grid2 select{width:100%;font-size:15px;color:var(--tx)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kpi div{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}
.kpi small{display:block;color:var(--mut);font-size:11px;margin-bottom:4px}.kpi b{font-size:20px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#0f1115}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--mut);font-size:11px;text-align:center;padding:4px}
td{padding:5px 4px;border-top:1px solid var(--bd);text-align:center}td input{width:84px;text-align:center}
.mt td input{width:60px;padding:6px 4px}
.cal td{font-size:16px;padding:7px 2px}.cal .y{color:var(--acc)}.cal .n{color:var(--mut)}
.up{color:var(--org)}.dn{color:var(--acc)}
.rate{display:flex;gap:6px;margin:6px 0 10px}.rate button{flex:1;padding:10px 0;font-size:16px}
.meter{height:12px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--bd);margin:8px 0}.meter i{display:block;height:100%;background:var(--blu)}
.phr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}.phr img{width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:zoom-in}
.phr .sp{flex:1}.phb{display:inline-block;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;font-size:13px;background:var(--bg)}
.cmp img{width:100%;border-radius:10px;aspect-ratio:3/4;object-fit:cover;background:#262b35}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.row input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc)}
</style></head><body>
<header><button id="burger" onclick="toggleMenu()" aria-label="Menu">☰</button><h1>DIARY MUSCU</h1><span></span></header>
<div id="veil" onclick="toggleMenu()"></div>
<aside id="side"></aside>
<div id="lb" onclick="lbClose()"><div class="lt" onclick="event.stopPropagation()"><button onclick="lbNext(-1)">◀</button><button class="x" onclick="lbClose()">✕ Fermer</button><button onclick="lbNext(1)">▶</button></div><img id="lbi" alt="" onclick="event.stopPropagation();lbNext(1)"><div class="cap" id="lbc"></div></div>
<div id="rt"><b id="rtt"></b><span id="rtb"><button onclick="rtAdd(-15)">−15 s</button> <button onclick="rtAdd(15)">+15 s</button> <button class="x" onclick="rtStop()">✕</button></span></div>
<main id="m"></main>
<script src="app.js"></script>
</body></html>
