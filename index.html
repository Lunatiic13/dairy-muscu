<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">

<style>
:root{--bg:#131f24;--card:#1f2c34;--bd:#37464f;--tx:#fff;--mut:#9fb0ba;--g:#58cc02;--gd:#58a700;--b:#1cb0f6;--bdk:#1899d6;--o:#ff9600;--od:#cc7800;--y:#ffc800;--r:#ff4b4b;--rd:#ea2b2b;--p:#ce82ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:700;background:var(--bg);color:var(--tx);line-height:1.35}

header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--bg);border-bottom:2px solid var(--bd)}
.brand{flex:1;display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;letter-spacing:.5px;color:var(--g);min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:0;background:none;color:#fff;font:inherit;font-weight:900;font-size:17px;padding:6px 8px;border-radius:12px;cursor:pointer;display:flex;gap:4px;align-items:center}
.chip.fire{color:var(--o)}.chip.xp{color:var(--y)}
main{max-width:720px;margin:auto;padding:14px 14px calc(120px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;gap:4px;padding:8px max(8px,calc((100vw - 720px)/2)) calc(8px + env(safe-area-inset-bottom));background:var(--bg);border-top:2px solid var(--bd)}
.tab{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:16px;border:2px solid transparent;background:none;color:var(--mut);font:inherit;font-weight:900;font-size:11px;letter-spacing:.3px;cursor:pointer}
.tab .ic{font-size:27px;line-height:1.1;filter:grayscale(1) opacity(.6);transition:transform .15s}
.tab.on{background:rgba(28,176,246,.15);border-color:var(--b);color:var(--b)}
.tab.on .ic{filter:none;transform:scale(1.12)}
.btn{font:inherit;font-weight:900;text-transform:uppercase;letter-spacing:.8px;font-size:15px;padding:13px 18px;border-radius:16px;border:2px solid var(--bd);border-bottom-width:4px;background:var(--card);color:var(--b);cursor:pointer;transition:transform .05s}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}

.btn.b{background:var(--b);border-color:var(--bdk);color:#fff}

.btn.sm{padding:9px 12px;font-size:13px}

.btn:disabled{opacity:.45;cursor:not-allowed}
.back{margin-bottom:10px}
.seg{display:flex;gap:6px;margin-bottom:14px;background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:5px}
.seg button{flex:1;font:inherit;font-weight:900;font-size:13px;padding:10px 4px;border-radius:13px;border:0;background:none;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--b);color:#fff}
input,select,textarea{font:inherit;font-weight:800;color:#fff;background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--b)}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--g);padding:0}

.title{font-size:26px;font-weight:900;margin:2px 0 12px}.title span{color:var(--g)}
.tip{display:flex;gap:10px;align-items:flex-start;background:rgba(28,176,246,.12);border:2px solid var(--b);color:#bfe8ff;border-radius:16px;padding:10px 12px;margin:10px 0;font-size:14px}
.tip.o{background:rgba(255,150,0,.12);border-color:var(--o);color:#ffe0b3}

.bubble{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.bubble .say{position:relative;flex:1;background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:11px 14px;font-size:15px}
.bubble .say:before{content:"";position:absolute;left:-9px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--bd);border-left:0}
.wkbar{display:flex;gap:8px;margin-bottom:12px}.wkbar select{font-size:16px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.dc{background:none;border:0;color:var(--mut);font:inherit;font-weight:800;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;cursor:pointer}
.dc i{font-style:normal;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;border:2px solid var(--bd);border-bottom-width:4px;background:var(--card);color:var(--mut)}
.dc.plan i{color:#fff}
.dc.part i{border-color:var(--o);color:var(--o)}

.dc.sel{color:var(--b)}.dc.sel i{box-shadow:0 0 0 3px var(--b)}
.dc.rest i{opacity:.4}
.sname{font-size:24px;font-weight:900;margin:0 0 8px}
.pbar{height:16px;border-radius:99px;background:var(--bd);overflow:hidden;position:relative}
.pbar b{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .4s;position:relative}
.pbar b:after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.3)}
.pbar.y b{background:var(--y)}
.prow{display:flex;align-items:center;gap:10px;margin:8px 0 14px}.prow .hint{white-space:nowrap}
.ex{padding:0;overflow:hidden}.ex.open{border-color:var(--b)}.ex.fin{border-color:var(--g)}
.exh{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;background:none;border:0;color:#fff;font:inherit;text-align:left;cursor:pointer}
.exh .st{flex:none;width:38px;height:38px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:var(--mut)}
.ex.fin .st{background:var(--g);color:#fff}.ex.open .st{background:var(--b);color:#fff}
.exh .nm{flex:1;font-weight:900;font-size:16px}.exh .nm small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.cnt{color:var(--mut);font-weight:900;font-size:14px}.ex.fin .cnt{color:var(--g)}
.exb{padding:0 14px 14px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:8px;align-items:center;margin-bottom:8px}
.set input[type=number]{text-align:center;font-size:17px}
.set .n{color:var(--mut);text-align:center;font-weight:900}
.lbl{text-align:center;color:var(--mut);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.6px}
.ckb{width:46px;height:46px;border-radius:50%;border:2px solid var(--bd);border-bottom-width:4px;background:var(--bg);color:transparent;font-size:22px;font-weight:900;cursor:pointer;padding:0}
.ckb.on{background:var(--g);border-color:var(--gd);color:#fff}
.chk{border-left:6px solid var(--o)}.chk.st2{border-left-color:var(--b)}
.chk.open{border-color:var(--g)}.chk .exh .st{font-size:20px;background:transparent}
.wr{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px solid var(--bd);cursor:pointer}
.wr:first-child{border-top:0}.wr span{font-weight:800;font-size:14px}.wr small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.wr.ck span{color:var(--mut);text-decoration:line-through}
.finc{display:flex;justify-content:space-between;align-items:center;gap:10px;border-color:var(--g);color:var(--g);font-weight:900}
.fire-card{text-align:center}
.flame{font-size:64px;line-height:1}.fire-n{font-size:44px;font-weight:900;color:var(--o)}
.dots{display:flex;justify-content:center;gap:8px;margin:12px 0}.dots i{width:26px;height:26px;border-radius:50%;background:var(--bd);display:block}.dots i.on{background:var(--o);box-shadow:0 0 12px rgba(255,150,0,.6)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal span{aspect-ratio:1;border-radius:12px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mut)}
.cal span.yes{background:var(--g);border-color:var(--gd);color:#fff}.cal span.td{border-color:var(--b);color:#fff}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.bd{text-align:center;border:2px solid var(--bd);border-radius:18px;padding:12px 6px;background:var(--bg)}
.bd .e{font-size:34px}.bd b{display:block;font-size:13px;margin-top:4px}.bd small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.bd.off{opacity:.4;filter:grayscale(1)}.bd.on{border-color:var(--y)}
.rec{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:2px solid var(--bd)}.rec:first-child{border-top:0}
.rec b{color:var(--y);white-space:nowrap}
.menu{padding:6px 14px}
.mrow{width:100%;display:flex;align-items:center;gap:14px;padding:14px 0;border:0;border-top:2px solid var(--bd);background:none;color:#fff;font:inherit;font-weight:900;font-size:16px;text-align:left;cursor:pointer}
.mrow:first-child{border-top:0}.mrow .mi{font-size:28px;width:38px;text-align:center}.mrow span.t{flex:1}.mrow small{display:block;color:var(--mut);font-size:12px;font-weight:700;margin-top:2px}.mrow .ch{color:var(--mut);font-size:22px}
.prof{display:flex;gap:14px;align-items:center}.prof .pn{font-size:21px;font-weight:900}
canvas{width:100%;height:auto;background:var(--bg);border-radius:16px;border:2px solid var(--bd);display:block}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.pk div{background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding:10px;text-align:center;font-size:12px;color:var(--mut)}.pk b{display:block;color:#fff;font-size:20px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.kpi div{background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding:10px;text-align:center}.kpi small{display:block;color:var(--mut);font-size:11px;margin-bottom:4px}.kpi b{font-size:19px}
.tag{display:inline-block;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:900;color:#131f24}
table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--mut);font-size:11px;padding:4px}td{padding:6px 4px;border-top:2px solid var(--bd);text-align:center}td input{width:90px;text-align:center}
.up{color:var(--o)}.dn{color:var(--g)}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.big2 img,.pg img{width:100%;border-radius:14px;background:#262b35;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.pg img{aspect-ratio:3/4}
.pgi{background:var(--bg);border:2px solid var(--bd);border-radius:16px;padding:8px}.pgi.sel{border-color:var(--b)}.pgi p{margin:6px 0;text-align:center;font-size:13px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmp img{width:100%;border-radius:14px;aspect-ratio:3/4;object-fit:cover}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-30px);opacity:0;z-index:90;background:var(--card);border:2px solid var(--y);border-radius:16px;padding:12px 16px;max-width:90vw;font-weight:900;pointer-events:none;transition:all .3s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ov{display:none;position:fixed;inset:0;z-index:70;background:rgba(19,31,36,.96);align-items:center;justify-content:center;padding:20px;overflow-y:auto}.ov.open{display:flex}
.cele{text-align:center;max-width:380px;width:100%}.cele h2{font-size:30px;color:var(--g);margin:10px 0}
.cele .ln{margin:6px 0;font-size:17px}.cele .mas{display:inline-block;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:80;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.sheet{align-self:flex-end;width:100%;max-width:560px;margin:auto;background:var(--card);border:2px solid var(--bd);border-radius:24px;padding:16px;position:relative;max-height:90vh;overflow-y:auto}
.sheet h2{font-size:22px;margin:0 36px 10px 0}.sheet .x{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:2px solid var(--bd);background:var(--bg);color:#fff;font-size:16px;cursor:pointer}
.info p{margin:8px 0;font-size:14px}.info b{color:var(--g)}.info .e b{color:var(--r)}
#lb{z-index:100;flex-direction:column;gap:10px;background:rgba(0,0,0,.94)}
#lb img{max-width:100%;max-height:calc(100vh - 140px);object-fit:contain;border-radius:12px;touch-action:pinch-zoom}
#lb .lt{display:flex;gap:8px;width:100%;max-width:640px;justify-content:space-between}
#lb .cap{color:var(--mut);font-size:13px;text-align:center}
</style></head><body>
<header><div class="brand" id="brand"></div><div id="chips" style="display:flex"></div></header>
<main id="m"></main>
<nav class="tabs" id="tabs" aria-label="Navigation principale"></nav>
<div id="toast"></div>
<div class="ov" id="cele"></div>
<div class="ov" id="md" onclick="closeSheet()"></div>
<div class="ov" id="lb" onclick="lbClose()"><div class="lt" onclick="event.stopPropagation()"><button class="btn sm" onclick="lbNext(-1)">◀</button><button class="btn sm r" onclick="lbClose()">✕ Fermer</button><button class="btn sm" onclick="lbNext(1)">▶</button></div><img id="lbi" alt="" onclick="event.stopPropagation();lbNext(1)"><div class="cap" id="lbc"></div></div>
<script>
const KEY='muscu3',OLD='muscu2',BK='muscu3_bk';
const DAYS=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"],DL={Lun:"L",Mar:"M",Mer:"M",Jeu:"J",Ven:"V",Sam:"S",Dim:"D"};
const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const today=()=>iso(new Date());
const frd=s=>{const[a,b,c]=s.split("-");return c+"/"+b+"/"+a};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const plural=(n,a,b)=>n+" "+(n>1?b:a);

/* ---------- programme ---------- */
const E=(n,s,t)=>({n,t,sets:Array.from({length:s},()=>({kg:"",reps:"",ok:false}))});
const TPL={
 FA:()=>({name:"Full body A",ex:[E("Tirage poitrine",3,"12-15"),E("Chest press",3,"12-15"),E("Presse à cuisses",3,"12-15"),E("Développé épaules machine",3,"12-15"),E("Curl",3,"12-15"),E("Gainage (s)",3,"30-40")]}),
 FB:()=>({name:"Full body B",ex:[E("Rowing poulie basse",3,"12-15"),E("Développé couché haltères",3,"12-15"),E("Fente arrière",3,"12"),E("Oiseau (pec deck inversé)",3,"15"),E("Triceps poulie",3,"12-15")]}),
 HA:()=>({name:"Haut A (pousser)",ex:[E("Développé couché haltères",4,"8-12"),E("Rowing unilatéral",3,"10-12"),E("Développé épaules assis",3,"8-12"),E("Curl haltères",2,"12-15")]}),
 BA:()=>({name:"Bas",ex:[E("Squat ou presse",3,"8-12"),E("Soulevé de terre roumain léger",3,"10"),E("Leg curl",3,"12"),E("Mollets",3,"15"),E("Gainage (s)",3,"40")]}),
 HB:()=>({name:"Haut B (tirer)",ex:[E("Tractions / tirage vertical",4,"8-10"),E("Pompes / développé incliné",3,"8-15"),E("Rowing buste penché",3,"10-12"),E("Élévations latérales",3,"12-15"),E("Extension triceps",2,"12-15")]}),
 HC:()=>({name:"Haut C (épaules/bras)",ex:[E("Développé militaire",3,"8-10"),E("Élévations latérales",4,"12-15"),E("Oiseau",3,"15"),E("Dips",3,"8-12"),E("Curl incliné",3,"10-12")]})
};
function makeWeek(w){const d={};DAYS.forEach(x=>d[x]={name:"Repos",ex:[]});const set=(day,k)=>d[day]=TPL[k]();
 if(w<=2){set("Mar","FA");set("Jeu","FB");set("Sam","FA")}else{set("Lun","HA");set("Mar","BA");set("Jeu","HB");set("Sam","HC")}return d}

/* ---------- données (copie unique depuis l'ancienne appli, sans la modifier) ---------- */
let D=null;
try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!D){try{const o=JSON.parse(localStorage.getItem(OLD));if(o&&o.weeks)D=o}catch(e){}}
if(!D){D={weeks:{}};for(let w=1;w<=6;w++)D.weeks[w]=makeWeek(w)}
D.done=D.done||{};D.state=D.state||{};D.imgs=D.imgs||{};D.warm=D.warm||{};D.stretch=D.stretch||{};
D.body=D.body||{p:{prenom:"",nom:"",age:"",taille:"",cible:""},w:{}};
D.sessions=D.sessions||{};D.badges=D.badges||{};D.best=D.best||0;D.recs=D.recs||0;
D.settings=Object.assign({goal:3,wake:false,lastExport:0},D.settings||{});
D.settings.rem=Object.assign({on:false,days:[2,4,6],time:"18:00",last:""},D.settings.rem||{});
const wk=()=>Object.keys(D.weeks).map(Number).sort((a,b)=>a-b);
let mode="log",W=+D.state.week||wk()[0],day=D.state.day||"Mar",OPEN=null;
if(!D.weeks[W])W=wk()[0];
if(!D.weeks[W][day])day="Mar";
const cd=()=>D.weeks[W][day];
const dayKey=(w,d)=>w+"|"+d;
const done=s=>s.ok||s.reps!=="";
function save(){D.state={week:W,day};try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast("⚠️ Stockage plein : exporte tes données")}autoBk()}
function autoBk(){try{const raw=localStorage.getItem(KEY);let b=JSON.parse(localStorage.getItem(BK)||"[]");const l=b[b.length-1];
 if(!l||Date.now()-l.t>1800000){b.push({t:Date.now(),d:raw});b=b.slice(-10);localStorage.setItem(BK,JSON.stringify(b))}}catch(e){}}

/* ---------- mascotte originale : Kilo la kettlebell ---------- */
function mascot(s,mood){const m=mood==="happy"?'<path d="M38 74 Q50 90 62 74 Z" fill="#131f24"/>':'<path d="M40 76 Q50 85 60 76" stroke="#131f24" stroke-width="4" fill="none" stroke-linecap="round"/>';
 return `<svg width="${s}" height="${s}" viewBox="0 0 100 100" aria-hidden="true"><path d="M30 40C30 6 70 6 70 40" fill="none" stroke="#58a700" stroke-width="10" stroke-linecap="round"/><circle cx="50" cy="63" r="33" fill="#58cc02"/><ellipse cx="38" cy="58" rx="9" ry="11" fill="#fff"/><ellipse cx="62" cy="58" rx="9" ry="11" fill="#fff"/><circle cx="40" cy="60" r="4.5" fill="#131f24"/><circle cx="60" cy="60" r="4.5" fill="#131f24"/>${m}<path d="M30 80C36 90 64 90 70 80" stroke="#58a700" stroke-width="3" fill="none" opacity=".5"/></svg>`}

/* ---------- stats, série, XP, badges ---------- */
function wstart(ds){const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function streak(){const cnt={};Object.values(D.sessions).forEach(ds=>{const w=wstart(ds);cnt[w]=(cnt[w]||0)+1});
 const goal=D.settings.goal,cur=wstart(today());let n=(cnt[cur]||0)>=goal?1:0;const dd=new Date(cur+"T12:00:00");
 for(let i=0;i<520;i++){dd.setDate(dd.getDate()-7);if((cnt[iso(dd)]||0)>=goal)n++;else break}
 return{n,cnt,goal,thisWeek:cnt[cur]||0}}
function stats(){let sets=0;wk().forEach(w=>DAYS.forEach(d=>D.weeks[w][d].ex.forEach(e=>e.sets.forEach(s=>{if(done(s))sets++}))));
 const sessions=Object.keys(D.sessions).length,xp=sets*10+sessions*50,st=streak();
 return{sets,sessions,xp,level:Math.floor(xp/300)+1,into:xp%300,streak:st.n,week:st.thisWeek,goal:st.goal,cnt:st.cnt}}
const BADGES=[

/* ---------- graphiques / progrès ---------- */
function drawLine(id,pts,zero=true){const c=$(id);if(!c)return;const x=c.getContext("2d"),w=c.width,h=c.height;x.clearRect(0,0,w,h);
 const fs=Math.max(11,Math.round(h/18)),pl=Math.round(w*.05),pr=Math.round(w*.04),pt=Math.round(h*.12),pb=Math.round(h*.14);x.font="800 "+fs+"px sans-serif";
 if(!pts.length){x.fillStyle="#9fb0ba";x.fillText("Pas encore de données",pl,pt+fs);return}
 let lo=Math.min(...pts.map(p=>p[1])),hi=Math.max(...pts.map(p=>p[1]));
 if(zero){lo=0;hi=hi*1.15||1}else{const pad=Math.max((hi-lo)*.25,.5);lo-=pad;hi+=pad}
 const X=i=>pl+(pts.length>1?i*((w-pl-pr)/(pts.length-1)):(w-pl-pr)/2),Y=v=>h-pb-(v-lo)/((hi-lo)||1)*(h-pt-pb);
 x.strokeStyle="#37464f";x.lineWidth=2;for(let k=0;k<4;k++){const y=pt+k*(h-pt-pb)/3;x.beginPath();x.moveTo(pl-6,y);x.lineTo(w-pr+6,y);x.stroke()}
 x.strokeStyle="#58cc02";x.lineWidth=Math.max(4,h/60);x.lineJoin="round";x.lineCap="round";x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(i),Y(p[1])):x.moveTo(X(i),Y(p[1])));x.stroke();
 pts.forEach((p,i)=>{x.fillStyle="#58cc02";x.beginPath();x.arc(X(i),Y(p[1]),Math.max(5,h/45),0,7);x.fill();x.fillStyle="#fff";x.fillText(p[1],X(i)-fs*.7,Y(p[1])-fs*.9);x.fillStyle="#9fb0ba";x.fillText(p[0],X(i)-fs*.7,h-pb*.3)})}
function series(name,m){const pts=[];wk().forEach(w=>{let v=0,any=false;DAYS.forEach(d=>D.weeks[w][d].ex.filter(x=>x.n==name).forEach(x=>x.sets.forEach(s=>{
  if(done(s)&&s.reps!==""){any=true;const kg=s.kg===""?0:s.kg;if(m=="max")v=Math.max(v,kg);else v+=s.reps}})));if(any)pts.push(["S"+w,Math.round(v*10)/10])});return pts}
function pickEx(n){PEX=n;prog()}
function prog(){const s=new Set();wk().forEach(w=>DAYS.forEach(d=>D.weeks[w][d].ex.forEach(e=>s.add(e.n))));
 const names=[...s].filter(n=>series(n,"rep").length).sort((a,b)=>a.localeCompare(b,"fr",{sensitivity:"base"}));let h=`<div class="title">Mes <span>progrès</span></div>`+seg(PMN,PM,"subProg");
 if(!names.length){$("m").innerHTML=h+'<div class="card hint">Aucune donnée pour le moment. Dès que tu notes des répétitions, la courbe apparaît ici.</div>';return}
 if(!names.includes(PEX))PEX=names[0];const p=series(PEX,PM),last=p[p.length-1][1],pr=p.length>1?p[p.length-2][1]:null,rec=Math.max(...p.map(q=>q[1]));
 h+=`<div class="wkbar"><select onchange="pickEx(this.value)">${names.map(n=>`<option ${n==PEX?'selected':''}>${n}</option>`).join("")}</select></div>
 <div class="card"><canvas id="pc" width="760" height="300"></canvas><div class="pk"><div>Dernier<b>${last}</b></div><div>Record<b>${rec}</b></div><div>Vs préc.<b>${pr!=null?delta(last-pr):'–'}</b></div></div></div>`;
 $("m").innerHTML=h;drawLine("pc",p,true)}

const P=()=>D.body.p,BW=()=>D.body.w,bmi=(kg,cm)=>(kg&&cm)?kg/((cm/100)**2):null;
const f1=v=>v==null?"–":(Math.round(v*10)/10).toString().replace(".",",");
function cat(b){if(b==null)return["–","#9fb0ba"];if(b<18.5)return["Insuffisance pondérale","#1cb0f6"];if(b<25)return["Corpulence normale","#58cc02"];if(b<30)return["Surpoids","#ffc800"];return["Obésité","#ff4b4b"]}
function delta(d){if(d==null||isNaN(d))return"–";const r=Math.round(d*10)/10;if(r==0)return"=";return r>0?`<span class="up">▲ +${f1(r)}</span>`:`<span class="dn">▼ -${f1(-r)}</span>`}
function setP(k,v){P()[k]=v;save();hdr();phys()}
function setW(w,v){if(v==="")delete BW()[w];else BW()[w]=+v;save();phys()}
function phys(){const p=P(),T=+p.taille||0,ws=wk(),have=ws.filter(w=>BW()[w]!=null);
 const first=have.length?BW()[have[0]]:null,last=have.length?BW()[have[have.length-1]]:null,pr=have.length>1?BW()[have[have.length-2]]:null;
 const bm=bmi(last,T),[cl,cc]=cat(bm),cible=+p.cible||null;
 const rows=ws.map((w,i)=>{const v=BW()[w],b=bmi(v,T);let pv=null;for(let k=i-1;k>=0;k--){if(BW()[ws[k]]!=null){pv=BW()[ws[k]];break}}
  return `<tr><td>S${w}</td><td><input type="number" inputmode="decimal" step="0.1" value="${v??''}" placeholder="kg" onchange="setW(${w},this.value)"></td><td>${f1(b)}</td><td>${v!=null&&pv!=null?delta(v-pv):'–'}</td></tr>`}).join("");

 <div class="card"><h3 style="margin-bottom:10px">Profil</h3><div class="grid2">

  <label>Âge<input type="number" inputmode="numeric" value="${p.age}" onchange="setP('age',this.value)"></label><label>Taille (cm)<input type="number" inputmode="numeric" value="${p.taille}" onchange="setP('taille',this.value)"></label>

  <p><span class="tag" style="background:${cc}">${cl}</span></p><p class="hint">IMC = poids ÷ taille² (OMS). Indicatif : l’IMC ne distingue pas muscle et graisse.</p>`:`<div class="hint">Renseigne ta taille et au moins un poids pour voir ton IMC.</div>`}</div>

function idb(){return new Promise((ok,no)=>{const r=indexedDB.open("diary2-photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("p",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}

 toast("🏋️ C’est l’heure de ton entraînement !");try{if("Notification"in window&&Notification.permission==="granted"){const reg=await navigator.serviceWorker.ready;reg.showNotification("Diary Muscu",{body:"C’est l’heure de ton entraînement !",icon:"../icon-192.png"})}}catch(e){}},20000);

/* ---------- sauvegardes ---------- */
function bakPage(){let b=[];try{b=JSON.parse(localStorage.getItem(BK)||"[]")}catch(e){}const le=D.settings.lastExport;
 $("m").innerHTML=`${back()}<div class="title">Sauve<span>gardes</span></div>
 <div class="card"><div class="tip">💾<div>Ton journal est enregistré automatiquement sur cet appareil. Des copies automatiques sont aussi gardées (10 maximum). <b>Elles restent sur ce téléphone</b> : exporte régulièrement un fichier pour te protéger d’un effacement ou d’un changement d’appareil.</div></div>
 <p class="hint">Dernier export : ${le?new Date(le).toLocaleDateString("fr-FR"):"jamais"}</p><button class="btn g big" onclick="exportAll()">Exporter tout (photos comprises)</button>
 <p class="hint" style="margin-top:14px">Importer un export</p><input type="file" accept=".json" onchange="importAll(this)"></div>
 <div class="card"><h3 style="margin-bottom:10px">Copies automatiques (journal sans photos)</h3>${b.length?`<select id="rid">${b.map((x,i)=>`<option value="${i}">${new Date(x.t).toLocaleString("fr-FR")}</option>`).reverse().join("")}</select><button class="btn big" onclick="restoreBk()">Restaurer cette copie</button>`:'<div class="hint">Aucune copie pour le moment.</div>'}</div>`}
async function exportAll(){try{let list=[];try{list=(await pdb("readonly",s=>s.getAll()))||[]}catch(e){}
 const ph=await Promise.all(list.map(a=>new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok({id:a.id,date:a.date,data:f.result});f.onerror=no;f.readAsDataURL(a.blob)})));
 D.settings.lastExport=Date.now();save();const blob=new Blob([JSON.stringify({format:"diary-v2",data:D,photos:ph})],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="diary-muscu-"+today()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(u),10000);bakPage()}catch(e){toast("⚠️ Export impossible")}}
async function importAll(inp){try{const v=JSON.parse(await inp.files[0].text());if(v.format!=="diary-v2"||!v.data||!v.data.weeks)throw 0;if(!confirm("Remplacer tout le journal actuel par cet export ? Exporte d’abord tes données récentes."))return;
 for(const p of(v.photos||[])){if(!/^data:image\//.test(p.data))throw 0;const b=await(await fetch(p.data)).blob();await pdb("readwrite",s=>s.put({id:p.id,date:p.date,blob:b}))}
 localStorage.setItem(KEY,JSON.stringify(v.data));location.reload()}catch(e){toast("⚠️ Fichier invalide ou import impossible")}inp.value=""}
function restoreBk(){let b=[];try{b=JSON.parse(localStorage.getItem(BK)||"[]")}catch(e){}const x=b[+$("rid").value];if(x&&confirm("Remplacer le journal actuel par cette copie ?")){localStorage.setItem(KEY,x.d);location.reload()}}

/* ---------- réglages / écran allumé ---------- */
let lock=null;
async function applyWake(){try{if(D.settings.wake&&document.visibilityState==="visible"&&"wakeLock"in navigator){if(!lock||lock.released)lock=await navigator.wakeLock.request("screen")}else if(lock){await lock.release();lock=null}}catch(e){}}
document.addEventListener("visibilitychange",applyWake);
function setPage(){const s=D.settings,sup="wakeLock"in navigator;
 $("m").innerHTML=`${back()}<div class="title"><span>Réglages</span></div>
 <div class="card"><h3 style="margin-bottom:8px">Objectif hebdomadaire</h3><select onchange="D.settings.goal=+this.value;save();hdr()">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${n==s.goal?'selected':''}>${plural(n,"séance","séances")} par semaine</option>`).join("")}</select>
 <p class="hint">Ta série compte les semaines consécutives où tu atteins cet objectif. Les jours de repos prévus ne la cassent pas.</p></div>
 <div class="card"><h3 style="margin-bottom:8px">Écran allumé pendant l’entraînement</h3><button class="btn ${s.wake?'':'g'} big" style="margin-top:0" onclick="D.settings.wake=!D.settings.wake;save();applyWake();setPage()">${s.wake?'Désactiver':'Activer'}</button>
 <p class="hint">${sup?"Fonction disponible sur ce navigateur. Elle se réactive quand tu reviens sur l’application.":"Non disponible sur ce navigateur."}</p></div>
 <div class="card"><h3 style="margin-bottom:8px">Zone sensible</h3><button class="btn r big" style="margin-top:0" onclick="if(confirm('Effacer toutes les données de cette version ? (Ton ancienne appli et tes exports ne sont pas touchés.)')){localStorage.removeItem(KEY);localStorage.removeItem(BK);location.reload()}">Réinitialiser cette version</button></div>`}

if(typeof history!=="undefined"&&history.replaceState)history.replaceState({m:"log"},"");
render();applyWake();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
